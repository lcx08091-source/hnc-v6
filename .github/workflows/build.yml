name: Build HNC arm64

# Triggers:
#   - push to main: full build + zip artifact
#   - pull_request: full build + zip artifact (v5.9.0: 合并前即可验证
#     C/Go 交叉编译与打包;Release 步骤有条件门,PR 运行不发版)
#   - workflow_dispatch: manual run from Actions UI。
#     v5.9.0 一键发版: 填 release_tag(如 v5.9.0)则构建后在同一个 run 内
#     创建 tag + GitHub Release 并挂 zip —— 必须在 main 上运行、tag 须与
#     module.prop 的 version 一致且尚不存在(见 Resolve release tag 步骤)。
#     留空 = 只构建不发版(原行为)。
#     背景: 会话/机器人 git 凭证通常只能推分支不能推 tag;且 GITHUB_TOKEN
#     创建的 tag 不会再触发其他 workflow,所以 tag+release 必须在构建 run
#     内一步完成 —— 本入口即为此设计。
#   - tags v*: also creates a GitHub Release with the zip attached
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发版 tag(如 v5.9.0)。留空=只构建不发版。须与 module.prop 的 version 一致,仅限 main。'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating releases on tags

    steps:
      # ─── Setup ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # v5.8.3 (audit): third_party/libbpf is now a git submodule (@ v1.4.7)
          # so CI can build hotspotd from source instead of shipping a stale
          # committed prebuilt.
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: daemon/hnc_httpd/go.sum

      # Android SDK (build-tools d8 + a platform android.jar) for compiling
      # the app-label dex helper (tools/applabel). Used only at build time;
      # only the resulting bin/hnc_applabel.dex ships in the module.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (build-tools + platform)
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Get version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          VERSION_SAFE=${VERSION//./_}
          VERSION_SAFE=${VERSION_SAFE//+/_}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_safe=$VERSION_SAFE" >> $GITHUB_OUTPUT
          echo "Building HNC version: $VERSION"

      # v5.9.0 一键发版: 解析本 run 是否要发 Release,输出 steps.reltag.outputs.tag
      # (空 = 不发版)。fail fast: 校验不过直接挂掉 run,构建不白跑。
      - name: Resolve release tag
        id: reltag
        env:
          INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          MODULE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG=""
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG="$INPUT_RELEASE_TAG"
            # a. 格式护栏(与 bin/version_consistency_check.sh / ci_preflight.sh 同一正则)
            echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+(\.[0-9]+){0,3})?(-(hotfix|hf)[0-9]+(\.[0-9]+)?)?$' \
              || { echo "ERROR: release_tag '$TAG' 格式非法"; exit 1; }
            # b. 与 module.prop 一致(防 tag 与内容不符 —— v5.8.9-portal 事故的护栏)
            [ "$TAG" = "$MODULE_VERSION" ] \
              || { echo "ERROR: release_tag '$TAG' != module.prop version '$MODULE_VERSION'"; exit 1; }
            # c. 只允许在 main 上发版
            [ "$GITHUB_REF" = "refs/heads/main" ] \
              || { echo "ERROR: 发版只能在 main 上运行 (当前 $GITHUB_REF)"; exit 1; }
            # d. tag 不得已存在
            if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "ERROR: tag $TAG 已存在于 origin"; exit 1
            fi
            echo "Release mode: will create tag+release $TAG at $GITHUB_SHA"
          elif printf '%s' "$GITHUB_REF" | grep -q '^refs/tags/v'; then
            TAG="$GITHUB_REF_NAME"
            echo "Tag-push mode: release for $TAG"
          else
            echo "No release for this run (build only)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ─── Preflight checks (fail fast) ─────────────────────
      - name: Make scripts executable
        run: |
          chmod 755 bin/*.sh service.sh post-fs-data.sh 2>/dev/null || true
          chmod 755 daemon/hnc_httpd/build.sh 2>/dev/null || true
          chmod 755 src/launcher/build.sh 2>/dev/null || true
          find bin -name "*.sh" -exec chmod 755 {} \; 2>/dev/null || true

      - name: Shell syntax check
        run: |
          echo "Checking all shell scripts with sh -n..."
          fail=0
          for f in $(find . -name "*.sh" -not -path './.github/*' -not -path './third_party*'); do
            if ! sh -n "$f" 2>&1; then
              echo "FAIL: $f"
              fail=$((fail + 1))
            fi
          done
          if [ $fail -gt 0 ]; then
            echo "$fail shell scripts failed syntax check"
            exit 1
          fi
          echo "All shell scripts passed sh -n"

      - name: Version consistency check
        run: sh bin/version_consistency_check.sh

      - name: Source preflight
        # v5.9.0: 去掉 continue-on-error。此前唯一的常态 fail 源是
        # "bin/hnc_dpid missing"(CI 构建期产物,preflight 跑在构建前),
        # 该项已在 ci_preflight.sh 内降为 warn —— 现在 fail 就是真问题,
        # 必须拦住构建。
        run: sh bin/ci_preflight.sh

      # v5.9.0: Go 静态检查与单元测试(此前 CI 完全没有 go vet/test,
      # 唯一 Go 质量关卡是 preflight 的二进制 strings 检查)。host GOOS 跑。
      - name: Go vet + test (hnc_httpd + dpid)
        run: |
          cd daemon/hnc_httpd && go vet ./... && go test ./...
          cd ../../src/dpid && go vet ./... && go test ./...

      # ─── Build Go components ──────────────────────────────
      - name: Build hnc_httpd (Go)
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd daemon/hnc_httpd
          bash build.sh
          ls -lh hnc_httpd
          file hnc_httpd | grep -q "ARM aarch64" || (echo "ERROR: hnc_httpd not arm64"; exit 1)

      - name: Build hnc_dpid (Go)
        run: |
          cd src/dpid
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../../bin/hnc_dpid ./cmd/dpid
          ls -lh ../../bin/hnc_dpid
          file ../../bin/hnc_dpid | grep -q "ARM aarch64" || exit 1
          chmod 755 ../../bin/hnc_dpid

      # rc36/PKG-1: rebuild hnc_watchdog fresh + stripped every CI run. It was a
      # committed prebuilt that CI never rebuilt → shipped stale + unstripped.
      # service.sh prefers this Go watchdog over the shell watchdog.sh.
      - name: Build hnc_watchdog (Go)
        run: |
          cd src/dpid
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../../bin/hnc_watchdog ./cmd/hnc_watchdog
          ls -lh ../../bin/hnc_watchdog
          file ../../bin/hnc_watchdog | grep -q "ARM aarch64" || exit 1
          file ../../bin/hnc_watchdog | grep -q "not stripped" && { echo "ERROR: hnc_watchdog not stripped"; exit 1; }
          chmod 755 ../../bin/hnc_watchdog

      # rc47/audit: hnc_dpid_supervisor is pure Go (./cmd/dpid_supervisor) and
      # does NOT depend on libbpf, yet CI never built it — it shipped as a stale
      # committed prebuilt, so the rc38 netlink-debounce fix (and anything since)
      # never reached users. Rebuild it fresh + stripped every CI run, same as
      # hnc_dpid / hnc_watchdog.
      - name: Build hnc_dpid_supervisor (Go)
        run: |
          cd src/dpid
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../../bin/hnc_dpid_supervisor ./cmd/dpid_supervisor
          ls -lh ../../bin/hnc_dpid_supervisor
          file ../../bin/hnc_dpid_supervisor | grep -q "ARM aarch64" || exit 1
          file ../../bin/hnc_dpid_supervisor | grep -q "not stripped" && { echo "ERROR: hnc_dpid_supervisor not stripped"; exit 1; }
          chmod 755 ../../bin/hnc_dpid_supervisor

      # ─── Build app-label dex helper (Java → dex) ──────────
      # Reads real localized PackageManager labels on-device via app_process.
      # Compiled against a public android.jar; @hide bootstrap done by
      # reflection in the source so no special framework jar is needed.
      - name: Build app-label dex helper
        run: |
          set -e
          ANDROID_JAR=$(ls "$ANDROID_HOME"/platforms/*/android.jar | sort -V | tail -1)
          D8=$(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)
          echo "android.jar = $ANDROID_JAR"
          echo "d8          = $D8"
          WORK="$RUNNER_TEMP/applabel"
          rm -rf "$WORK"; mkdir -p "$WORK/classes"
          javac -source 8 -target 8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -d "$WORK/classes" tools/applabel/*.java
          "$D8" --release --min-api 21 --lib "$ANDROID_JAR" \
            --output "$WORK" \
            $(find "$WORK/classes" -name '*.class')
          test -s "$WORK/classes.dex" || (echo "ERROR: d8 produced no classes.dex"; exit 1)
          cp "$WORK/classes.dex" bin/hnc_applabel.dex
          chmod 644 bin/hnc_applabel.dex
          ls -lh bin/hnc_applabel.dex
          # Sanity: the dex must reference our helper class.
          if command -v strings >/dev/null 2>&1; then
            strings bin/hnc_applabel.dex | grep -q "io/hnc/applabel/AppLabel" \
              || (echo "ERROR: dex missing AppLabel class marker"; exit 1)
          fi

      # ─── Build C launcher (rc30.12 introduced this) ───────
      - name: Build hnc_launcher + fork_probe (C)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd src/launcher
          bash build.sh install
          ls -lh ../../bin/hnc_launcher ../../bin/fork_probe
          file ../../bin/hnc_launcher | grep -q "ARM aarch64" || exit 1
          file ../../bin/fork_probe   | grep -q "ARM aarch64" || exit 1

      # ─── Build hnc_tc_ingress (C, no third_party) ─────────
      - name: Build hnc_tc_ingress (C)
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd daemon/tc_netlink
          bash build.sh arm64
          # Copy result into bin/
          if [ -f out/arm64/hnc_tc_ingress ]; then
            cp out/arm64/hnc_tc_ingress ../../bin/hnc_tc_ingress
            chmod 755 ../../bin/hnc_tc_ingress
          fi
          file ../../bin/hnc_tc_ingress | grep -q "ARM aarch64" || exit 1

      # ─── Build hotspotd + hnc_ipc + mdns_resolve (C, needs libbpf submodule) ─
      # v5.8.3 (audit): hotspotd was a committed prebuilt that CI never rebuilt
      # (libbpf wasn't vendored), so C fixes (rc39 scheduler.c dynamic read,
      # rc43 offload re-probe) silently never shipped. libbpf is now a git
      # submodule (third_party/libbpf @ v1.4.7); build.sh compiles libbpf.a +
      # hotspotd + hnc_ipc + mdns_resolve (+ the BPF LSM object) fresh every run.
      - name: Build hotspotd + hnc_ipc + mdns_resolve (C)
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          test -f third_party/libbpf/src/libbpf.c \
            || { echo "ERROR: third_party/libbpf submodule not checked out (need submodules: recursive)"; exit 1; }
          cd daemon/hotspotd
          bash build.sh arm64
          cd ../..
          for b in bin/hotspotd bin/hnc_ipc bin/mdns_resolve; do
            file "$b" | grep -q "ARM aarch64" || { echo "ERROR: $b not arm64"; exit 1; }
            chmod 755 "$b"
          done
          echo "OK: hotspotd + hnc_ipc + mdns_resolve built arm64"

      # ─── Verify remaining source-less prebuilt (hnc_ndpi_probe) ───
      # hnc_ndpi_probe has no source in this repo, so it stays a committed
      # prebuilt and cannot be CI-rebuilt.
      - name: Verify pre-built binaries
        run: |
          for bin in bin/hnc_ndpi_probe; do
            if [ ! -f "$bin" ]; then
              echo "ERROR: $bin missing — no source in repo, must be committed to git"
              exit 1
            fi
            file "$bin" | grep -q "ARM aarch64" || (echo "ERROR: $bin not arm64"; exit 1)
            chmod 755 "$bin"
          done
          echo "OK: hnc_ndpi_probe present (arm64)"

      - name: Fix file permissions
        run: |
          chmod 755 bin/*.sh 2>/dev/null || true
          chmod 755 bin/hotspotd bin/hnc_ipc bin/hnc_tc_ingress 2>/dev/null || true
          chmod 755 bin/hnc_dpid bin/hnc_launcher bin/fork_probe 2>/dev/null || true
          chmod 755 bin/mdns_resolve 2>/dev/null || true
          chmod 755 daemon/hnc_httpd/hnc_httpd 2>/dev/null || true
          chmod 755 post-fs-data.sh service.sh

      # ─── Final binary verification ────────────────────────
      - name: Verify version strings injected correctly
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Expecting version $VERSION in binaries..."
          
          # hnc_httpd should have main.version injected
          if ! strings daemon/hnc_httpd/hnc_httpd | grep -qF "$VERSION"; then
            echo "ERROR: hnc_httpd missing version string $VERSION"
            echo "       (build.sh should have injected it via -X main.version=$VERSION)"
            exit 1
          fi
          echo "OK: hnc_httpd contains $VERSION"
          
          # hnc_dpid has its own version (0.5.3-rc30.12.x), not module version
          if ! strings bin/hnc_dpid | grep -qE "0\.5\.[0-9]+.*rc30"; then
            echo "WARN: hnc_dpid version string not in expected format"
          else
            echo "OK: hnc_dpid version string present"
          fi
          
          # hnc_launcher has its own version (0.1.0-rc30.12)
          if ! strings bin/hnc_launcher | grep -qF "0.1.0-rc30.12"; then
            echo "WARN: hnc_launcher version string missing"
          else
            echo "OK: hnc_launcher version string present"
          fi

      # ─── v5.9.3 · BUG-015 B: 文档版本占位符注入 ────────────
      # bin/inject_version_to_docs.sh 从 rc30.12.34 就写好了, 但从来没被任何
      # 地方调用过 → README.md 又不在下面 zip 的排除列表里 → 用户装机后看到的
      # "版本" 栏一直是字面 {{VERSION}} ({{DATE}}), 而 module.prop 已经是 v5.9.x。
      #
      # 必须在 Package zip 之前跑, 且**只改 runner 工作区, 绝不 commit 回仓库**:
      # 一旦把注入结果 commit 进去, 下次 inject 就走脚本 :78-81 的 noop 分支
      # (文件里已经没有占位符了), 版本号会永久锁死在某个旧版本 —— 这是本条
      # 最危险的误修法, 不要"顺手 git add"。
      #
      # 三步自证: 注入 → --check 确认占位符已消失 → 带 HNC_RELEASE_CHECK=1 再跑
      # 一次版本护栏 (该变量把 version_consistency_check.sh 里的占位符 warn 升级
      # 成 fail, 拦住任何带占位符的包出门)。
      - name: Inject version into docs (README/ARCHITECTURE)
        run: |
          sh bin/inject_version_to_docs.sh
          sh bin/inject_version_to_docs.sh --check
          HNC_RELEASE_CHECK=1 sh bin/version_consistency_check.sh
          echo "--- README 版本行 (注入后) ---"
          grep -n '^- \*\*版本\*\*' README.md || true

      # ─── Package zip ──────────────────────────────────────
      - name: Package module zip
        run: |
          OUT="HNC-${{ steps.version.outputs.version_safe }}-arm64.zip"
          TOOLS_OUT="hnc-ground-truth-tools.zip"
          
          # Clean build artifacts before zipping
          rm -rf daemon/hotspotd/prebuilt
          rm -rf daemon/tc_netlink/out
          rm -rf third_party_build/_libs_out 2>/dev/null || true
          rm -rf third_party_build/_obj 2>/dev/null || true
          
          # Main module zip - EXCLUDES tools/ground_truth/ (rc30.12.23+)
          # tools/ground_truth/ is shipped as a separate zip below.
          zip -rqX "$OUT" . \
            -x ".*" \
            -x "*/.*" \
            -x "*.zip" \
            -x ".github/*" \
            -x "**/_libs_out/*" \
            -x "**/_obj/*" \
            -x "**/build/*" \
            -x "**/out/*" \
            -x "**/prebuilt/*" \
            -x "tools/ground_truth/*" \
            -x "tools/ground_truth" \
            -x "tools/applabel/*" \
            -x "tools/applabel" \
            -x "src/*" -x "src" \
            -x "docs/*" -x "docs" \
            -x "test/*" -x "test" \
            -x "third_party_build/*" -x "third_party_build" \
            -x "third_party_prebuilt/*" -x "third_party_prebuilt" \
            -x "third_party/*" -x "third_party" \
            -x "bpf/*" -x "bpf" \
            -x "daemon/**/*.go" \
            -x "daemon/**/*.c" \
            -x "daemon/**/*.h" \
            -x "PATCH-NOTES-*.md" \
            -x "MIGRATION-PROPOSAL-*.md" \
            -x "ARCHITECTURE.md" \
            -x "EVOLUTION.md" \
            -x "COMPATIBILITY.md" \
            -x "INSTRUCTIONS.md" \
            -x "CLAUDE.md"
          
          echo "OUT_ZIP=$OUT" >> $GITHUB_ENV
          ls -lh "$OUT"
          
          # Separate ground-truth tools zip (rc30.12.23+)
          # Lightweight (~15 KB), only needed when expanding DPI rules.
          if [ -d tools/ground_truth ]; then
            (cd tools/ground_truth && zip -rqX "../../$TOOLS_OUT" .)
            echo "TOOLS_ZIP=$TOOLS_OUT" >> $GITHUB_ENV
            ls -lh "$TOOLS_OUT"
          fi
          
          # Print summary
          echo ""
          echo "=== Module zip contents (last lines) ==="
          unzip -l "$OUT" | tail -5
          echo ""
          if [ -f "$TOOLS_OUT" ]; then
            echo "=== Tools zip contents ==="
            unzip -l "$TOOLS_OUT"
          fi

      - name: Compute SHA256 of zips
        run: |
          sha256sum "${{ env.OUT_ZIP }}" | tee "${{ env.OUT_ZIP }}.sha256"
          if [ -n "${{ env.TOOLS_ZIP }}" ] && [ -f "${{ env.TOOLS_ZIP }}" ]; then
            sha256sum "${{ env.TOOLS_ZIP }}" | tee "${{ env.TOOLS_ZIP }}.sha256"
          fi

      # ─── Upload as Actions artifact ───────────────────────
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNC-${{ steps.version.outputs.version_safe }}-arm64
          path: |
            ${{ env.OUT_ZIP }}
            ${{ env.OUT_ZIP }}.sha256
          retention-days: 30

      - name: Upload ground-truth tools artifact
        if: env.TOOLS_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: hnc-ground-truth-tools
          path: |
            ${{ env.TOOLS_ZIP }}
            ${{ env.TOOLS_ZIP }}.sha256
          retention-days: 30

      # ─── Auto-release: tag push 或 workflow_dispatch 一键发版 ───────
      # v5.9.0: 条件从 startsWith(github.ref, 'refs/tags/v') 改为 reltag 步骤
      # 的输出;dispatch 发版时 tag 尚不存在,action-gh-release 会用
      # target_commitish 在当前 commit 上创建它(tag+release 一步完成)。
      # prerelease 判定改用 resolved tag(dispatch 时 github.ref 是 main,
      # 旧的 contains(github.ref,...) 会失真)。
      - name: Create GitHub Release (tag push or manual release)
        if: steps.reltag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.OUT_ZIP }}
            ${{ env.OUT_ZIP }}.sha256
            ${{ env.TOOLS_ZIP }}
            ${{ env.TOOLS_ZIP }}.sha256
          prerelease: ${{ contains(steps.reltag.outputs.tag, 'alpha') || contains(steps.reltag.outputs.tag, 'beta') || contains(steps.reltag.outputs.tag, 'rc') }}
          body: |
            HNC ${{ steps.version.outputs.version }} - automated build.
            
            See CHANGELOG.md for changes in this release.
            
            **Install**: Download the `.zip` below and install via KernelSU / SukiSU / Magisk Manager.
            
            **SHA256**:
            ```
            (see attached .sha256 file)
            ```
