<title>HNC Glass</title>
<style>
/* 布局: 一张白色"桌面"上浮着一块块玻璃; 内容层是磨砂玻璃, 功能层(底栏 / 圆按钮 / 弹层 / 滑块 / 分段水滴)是真折射玻璃 */
:root{
  --bg:#F7F8FB; --ink:#0B0D12; --ink-2:rgba(11,13,18,.62); --ink-3:rgba(11,13,18,.40); --hair:rgba(11,13,18,.08);
  --blue:#0A7CFF; --green:#1FC45A; --red:#FF3B30; --orange:#FF9500; --violet:#AF52DE; --teal:#20B8C8;
  --fill:rgba(255,255,255,.40); --fill-hi:rgba(255,255,255,.66); --fill-lo:rgba(255,255,255,.22); --well:rgba(118,118,128,.10);
  --rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.5),inset 1px 0 0 rgba(255,255,255,.6),inset -1px 0 0 rgba(255,255,255,.6),0 0 0 .5px rgba(30,40,70,.07);
  --drop:0 14px 34px -12px rgba(30,45,90,.22),0 2px 6px rgba(30,45,90,.05);
  --sheen:linear-gradient(162deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.16) 30%,rgba(255,255,255,0) 52%);
  --a1:rgba(60,140,255,.46); --a2:rgba(255,100,180,.36); --a3:rgba(60,215,180,.34); --a4:rgba(255,175,60,.34);
  --font:-apple-system,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",system-ui,sans-serif;
  --num:"SF Pro Rounded","SF Pro Display",-apple-system,"HarmonyOS Sans SC",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --spring:cubic-bezier(.34,1.45,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  --tint:.62; --blur:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030305; --ink:#F4F5F8; --ink-2:rgba(244,245,248,.66); --ink-3:rgba(244,245,248,.42); --hair:rgba(255,255,255,.09);
  --fill:rgba(42,42,50,.44); --fill-hi:rgba(58,58,68,.64); --fill-lo:rgba(40,40,48,.26); --well:rgba(118,118,128,.22);
  --rim:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 0 0 .5px rgba(0,0,0,.6);
  --drop:0 16px 40px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35);
  --sheen:linear-gradient(162deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 30%,rgba(255,255,255,0) 52%);
  --a1:rgba(30,100,255,.42); --a2:rgba(200,50,150,.32); --a3:rgba(20,160,140,.30); --a4:rgba(220,130,30,.26); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#030305; --ink:#F4F5F8; --ink-2:rgba(244,245,248,.66); --ink-3:rgba(244,245,248,.42); --hair:rgba(255,255,255,.09);
  --fill:rgba(42,42,50,.44); --fill-hi:rgba(58,58,68,.64); --fill-lo:rgba(40,40,48,.26); --well:rgba(118,118,128,.22);
  --rim:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 0 0 .5px rgba(0,0,0,.6);
  --drop:0 16px 40px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35);
  --sheen:linear-gradient(162deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 30%,rgba(255,255,255,0) 52%);
  --a1:rgba(30,100,255,.42); --a2:rgba(200,50,150,.32); --a3:rgba(20,160,140,.30); --a4:rgba(220,130,30,.26); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:12px}

/* 环境光: 白底上的四团色光, 缓慢漂移 —— 玻璃要有东西可以弯 */
.amb{position:fixed;inset:-30%;z-index:-1;pointer-events:none;filter:blur(70px) saturate(140%);
  background:radial-gradient(30% 26% at 16% 12%,var(--a1),transparent 70%),radial-gradient(28% 26% at 86% 26%,var(--a2),transparent 70%),
             radial-gradient(30% 26% at 20% 74%,var(--a3),transparent 70%),radial-gradient(28% 28% at 84% 90%,var(--a4),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(3%,-2%,0) rotate(7deg)}100%{transform:translate3d(-3%,2%,0) rotate(-6deg)}}

/* 玻璃材质 */
.g{position:relative;isolation:isolate;background:color-mix(in srgb,var(--fill-hi) calc(var(--tint) * 100%),transparent);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(185%);backdrop-filter:blur(var(--blur)) saturate(185%);box-shadow:var(--rim),var(--drop);border-radius:26px}
.g::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--sheen);pointer-events:none}
.gx{position:relative;isolation:isolate;background:var(--fill-lo);
  -webkit-backdrop-filter:var(--hyalite, blur(10px) saturate(190%) brightness(1.04));backdrop-filter:var(--hyalite, blur(10px) saturate(190%) brightness(1.04));
  box-shadow:var(--hyalite-edge, var(--rim)),var(--drop)}
.gx::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--sheen);opacity:.7;pointer-events:none}

/* 版心 */
.app{padding:calc(env(safe-area-inset-top,0px) + 58px) 16px calc(env(safe-area-inset-bottom,0px) + 120px);max-width:760px;margin:0 auto;transform-origin:50% 0;
  transition:transform .55s var(--ease),border-radius .55s var(--ease),filter .55s var(--ease)}
.page{display:none;flex-direction:column;gap:14px}
.page.on{display:flex;animation:pin .28s var(--ease)}
@keyframes pin{from{opacity:.35;transform:scale(.985)}}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 2px}
.lt h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lt p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.cap{font-size:13px;color:var(--ink-3);padding:6px 6px 0;display:flex;justify-content:space-between;align-items:baseline}
.cap b{font-weight:600;color:var(--ink-2)}

/* 顶部: 滚动边缘渐隐模糊 + 小标题 + 玻璃圆按钮 */
.edge{position:fixed;z-index:40;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 74px);pointer-events:none;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 88%,transparent),color-mix(in srgb,var(--bg) 0%,transparent));
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent);opacity:var(--ep,0)}
.bar{position:fixed;z-index:45;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 56px);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0;display:flex;align-items:center;justify-content:flex-end;gap:10px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar .st{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translate(-50%,calc((1 - var(--ep,0)) * 6px));opacity:var(--ep,0);font-weight:600;font-size:17px;pointer-events:none}
.orb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--spring)}
.orb svg{width:21px;height:21px}
.orb:active{transform:scale(1.12);transition-duration:.16s}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg);z-index:2}

/* 此刻: 大数字 + 流动的实时曲线 */
.hero{padding:18px 18px 12px;border-radius:30px;overflow:hidden}
.hero .row{display:flex;gap:18px;align-items:flex-end}
.hero .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.hero .v{font-size:40px;font-weight:700;line-height:1}
.hero .v small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px}
.hero .dn .k i{background:var(--blue)} .hero .up .k i{background:var(--violet)}
.hero .k i{width:7px;height:7px;border-radius:50%}
.hero .up .v{font-size:26px}
.hero .on{margin-left:auto;text-align:right}
.hero .on .v{font-size:26px}
.hero canvas{display:block;width:100%;height:74px;margin-top:10px}
.hero .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:2px}

/* 快捷操作: 横向玻璃胶囊 */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:38px;padding:0 15px;border-radius:19px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;transition:transform .5s var(--spring)}
.pill svg{width:16px;height:16px}
.pill:active{transform:scale(1.07);transition-duration:.15s}
.pill.on{background:linear-gradient(180deg,#2E97FF,#0A74F5);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -8px rgba(10,124,255,.7)}

/* 设备磁贴 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:14px;border-radius:26px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;transition:transform .55s var(--spring)}
.tile:active{transform:scale(.97);transition-duration:.14s}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.1),0 6px 14px -6px var(--c,rgba(0,0,0,.3));background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c))}
.ic svg{width:22px;height:22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.dot.off{background:var(--ink-3);box-shadow:none}
.tile .n{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .m{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile .sp{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tile .sp .d{color:var(--blue)} .tile .sp .u{color:var(--violet)}
.using{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 4px;border-radius:12px;background:var(--well);font-size:12px;font-weight:600;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.using i{width:16px;height:16px;border-radius:5px;flex:none;background:var(--c)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}

/* 分组列表(玻璃托盘) */
.list{border-radius:26px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;position:relative;width:100%;text-align:left}
.li+.li::before{content:"";position:absolute;top:0;left:64px;right:0;height:.5px;background:var(--hair)}
.li.plain+.li.plain::before{left:16px}
.li .tx{flex:1;min-width:0}
.li .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex:none;font-size:14px;font-weight:600}
.li .r small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.li .ic{width:36px;height:36px;border-radius:11px;font-weight:800;font-size:15px}
.meter{height:5px;border-radius:3px;background:var(--well);margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--c);transform-origin:0 50%;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.chev{width:14px;height:14px;color:var(--ink-3);flex:none}

/* 分段控件: 玻璃水滴滑块(真折射), 文字在水滴下面被放大 */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:40px;padding:4px;border-radius:20px;background:var(--well)}
.seg button{position:relative;z-index:2;font-size:13.5px;font-weight:600;color:var(--ink-2);border-radius:16px;transition:color .3s}
.seg button.on{color:var(--ink)}
.seg .drop{position:absolute;z-index:1;top:4px;bottom:4px;left:4px;border-radius:16px;pointer-events:none;background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:var(--hyalite, blur(1px) saturate(180%));backdrop-filter:var(--hyalite, blur(1px) saturate(180%));box-shadow:var(--hyalite-edge, var(--rim)),0 4px 12px rgba(30,45,90,.16);
  transition:transform .6s var(--spring),width .3s var(--ease)}
:root[data-theme="dark"] .seg .drop{background:rgba(255,255,255,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg .drop{background:rgba(255,255,255,.16)}}
.seg.small{height:34px;padding:3px;border-radius:17px}
.seg.small .drop{top:3px;bottom:3px;left:3px;border-radius:14px}
.seg.small button{font-size:12.5px}

/* 图表卡 */
.card{padding:16px}
.card h2{margin:0;font-size:17px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chart{position:relative;margin-top:12px}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .ax{font-size:10px;fill:var(--ink-3);font-family:var(--mono)}
.chart .gl{stroke:var(--hair);stroke-dasharray:3 4}
.chart .b{transition:opacity .2s}
.chart .b:hover{opacity:.8}
.tip{position:absolute;z-index:3;top:-6px;transform:translate(-50%,-100%);padding:7px 11px;border-radius:14px;font-size:12px;white-space:nowrap;pointer-events:none;background:var(--fill-hi);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--rim),var(--drop)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:14px 16px;border-radius:24px}
.kpi .k{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:30px;font-weight:700;margin-top:4px}
.kpi .v small{font-size:14px;color:var(--ink-2);font-weight:600;margin-left:2px}
.kpi .d{font-size:12px;font-weight:600;margin-top:2px}

/* 搜索框 */
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-3)}
.search svg{width:18px;height:18px;color:var(--ink-3)}

/* 开关: 按住时滑块变成一颗被拉长的清玻璃 */
.tg{position:relative;width:62px;height:30px;border-radius:15px;background:var(--well);flex:none;transition:background-color .3s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:38px;height:26px;border-radius:13px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.14),0 1px 1px rgba(0,0,0,.06);
  transition:transform .55s var(--spring),width .35s var(--spring),background-color .2s,box-shadow .2s}
.tg[aria-checked="true"]{background:var(--green)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
.tg:active::after{width:46px;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(1.5px) saturate(180%);backdrop-filter:blur(1.5px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.8),0 5px 14px rgba(0,0,0,.2);transform:scale(1.12)}
.tg[aria-checked="true"]:active::after{transform:translateX(12px) scale(1.12)}

/* 液态滑块 */
.sl{position:relative;height:44px;touch-action:none;cursor:pointer}
.sl .track{position:absolute;left:0;right:0;top:17px;height:10px;border-radius:5px;background:var(--well);overflow:hidden}
.sl .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#57B0FF,#0A7CFF)}
.sl .th{position:absolute;top:8px;left:0;width:44px;height:28px;margin-left:-22px;border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.08);
  transition:width .35s var(--spring),height .35s var(--spring),top .35s var(--spring),margin .35s var(--spring),background-color .2s,border-radius .35s var(--spring)}
.sl.drag .th{width:62px;height:40px;top:2px;margin-left:-31px;border-radius:20px;background:rgba(255,255,255,.14);
  -webkit-backdrop-filter:var(--hyalite, blur(1px) saturate(180%));backdrop-filter:var(--hyalite, blur(1px) saturate(180%));box-shadow:var(--hyalite-edge, var(--rim)),0 8px 20px rgba(0,0,0,.18)}
.slv{display:flex;justify-content:space-between;align-items:baseline}
.slv b{font-size:28px;font-weight:700}
.slv span{font-size:12.5px;color:var(--ink-3)}

/* 底栏: 一整条真折射的玻璃胶囊 + 一滴清玻璃透镜; 往下滚会缩成只剩当前页的小胶囊 */
.dock{position:fixed;z-index:60;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;justify-content:center;pointer-events:none}
.tabs{pointer-events:auto;position:relative;height:64px;width:min(100%,420px);border-radius:32px;padding:5px;display:grid;grid-template-columns:repeat(4,1fr);
  transition:width .6s var(--spring)}
.tab{position:relative;z-index:2;display:grid;justify-items:center;align-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink);opacity:.72;transition:opacity .3s,color .3s}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--blue);opacity:1}
.lens{position:absolute;z-index:1;top:5px;bottom:5px;left:5px;border-radius:27px;pointer-events:none;background:rgba(255,255,255,.34);
  -webkit-backdrop-filter:var(--hyalite, blur(1px) saturate(200%) brightness(1.05));backdrop-filter:var(--hyalite, blur(1px) saturate(200%) brightness(1.05));
  box-shadow:var(--hyalite-edge, var(--rim)),0 5px 14px -4px rgba(30,45,90,.25);will-change:transform}
:root[data-theme="dark"] .lens{background:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lens{background:rgba(255,255,255,.12)}}
.fab{pointer-events:auto;width:64px;height:64px;border-radius:32px;display:grid;place-items:center;flex:none;transition:transform .5s var(--spring)}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(1.1);transition-duration:.15s}
.dock.mini .tabs{width:128px;grid-template-columns:1fr}
.dock.mini .tab:not(.on){display:none}
.dock.mini .tab.on{grid-row:1;grid-column:1}

/* 弹层: 悬浮玻璃面板, 两档停靠(中 / 高), 背后页面缩小 */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:81;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:640px;margin:0 auto;height:calc(92vh - env(safe-area-inset-top,0px));border-radius:38px;

.sbody{flex:1;overflow:auto;padding:0 18px 24px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.shd{display:flex;align-items:center;gap:12px}
.shd .ic{width:52px;height:52px;border-radius:17px}
.shd .ic svg{width:27px;height:27px}
.shd h3{margin:0;font-size:22px;font-weight:700}
.shd p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.shd .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--well);display:grid;place-items:center}
.shd .x svg{width:16px;height:16px}
.plate{border-radius:24px;padding:14px 16px;background:rgba(255,255,255,.4);box-shadow:var(--rim)}
:root[data-theme="dark"] .plate{background:rgba(255,255,255,.06)}

.plate h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.kv+.kv{border-top:.5px solid var(--hair)}
.kv .t{font-size:15.5px}
.kv .s{font-size:12px;color:var(--ink-3)}
.cbtn{height:52px;border-radius:26px;font-size:17px;font-weight:600;width:100%;transition:transform .5s var(--spring)}
.cbtn:active{transform:scale(1.03);transition-duration:.15s}

.conn{display:flex;align-items:center;gap:10px;min-height:46px}
.conn+.conn{border-top:.5px solid var(--hair)}
.proto{font-size:10.5px;font-weight:700;font-family:var(--mono);padding:3px 6px;border-radius:7px;background:var(--well);color:var(--ink-2)}
.conn .h{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn .h small{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);font-weight:400}
.conn .r{font-size:12px;font-family:var(--mono);text-align:right;color:var(--ink-2)}
.toast{position:fixed;z-index:95;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;

.toast.on{transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;color:var(--green)}
.hint{font-size:12px;color:var(--ink-3);text-align:center;padding:4px 20px}

  /* ── 点击 ── */

    if (t.closest('#themeb')) { var R = document.documentElement, dark = R.getAttribute('data-theme') ? R.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; R.setAttribute('data-theme', dark ? 'light' : 'dark'); return; }

  var tt = 0;
