<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>HNC · Hotspot Network Control</title>
<!--
  HNC WebUI v6 (v5.11 起的新版界面)
  · 视觉: 原版统计页的设计语言 + 卡片就地展开 + 平板分栏 + 可拖动液态玻璃底栏(弹簧物理)
  · 传输: KernelSU/SukiSU WebView 里用 window.ksu.exec("curl ...") 桥接到本机 hnc_httpd 127.0.0.1:8444
          (带 X-HNC-Local-Admin 本地密钥); 远程浏览器同源 fetch + cookie, 401 → /pair 配对
  · 底栏透镜的折射/色散: Hyalite by VII-Cae (VII), MIT — https://github.com/VII-Cae/hyalite--liquid-glass
    (hyalite.js 与本页同目录; 缺失或非 Chromium 内核时自动退回模糊 + CSS 色散描边)
  · 文件: css/base.css → css/apple.css → css/liquid.css(按此顺序层叠);
          hyalite.js → js/core.js → fx → devices → apps → stats → settings → sheets → main(经典脚本,
          共享一个全局作用域, 顺序不可调换, 见 js/core.js 头注释)。全部用相对路径: KSU 管理器
          (file:// 或其内置服务)与 hnc_httpd(/css/*、/js/* 路由, Cache-Control: no-cache)都能加载。
-->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/apple.css">
<link rel="stylesheet" href="css/liquid.css">
<!-- 首帧前按本地偏好设好主题/风格, 避免外链脚本加载期间先闪一下默认样式(与 fx.js applyTheme 一致, 之后由它接管) -->
<script>(function () { try { var r = document.documentElement, g = function (k) { return localStorage.getItem(k); }, t = g('hnc6.theme'), s = g('hnc6.style'); if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); if (s === 'apple' || s === 'liquid') r.setAttribute('data-style', 'apple'); if (s === 'liquid') r.setAttribute('data-glass', 'liquid'); if (g('hnc6.motion') === '0') r.classList.add('calm'); if (g('hnc6.lowfx') === '1') r.classList.add('lowfx'); } catch (_) {} })();</script>
</head>
<body>
<div class="mesh" aria-hidden="true"></div>

<header class="header">
  <div class="brand"><div class="brand-title">HNC</div><div class="brand-sub">HOTSPOT NETWORK CONTROL</div></div>
  <div class="htitle" id="htitle" aria-hidden="true"></div>
  <span class="sample" id="mode-pill" hidden></span>
  <button class="hbtn press" id="bell" aria-label="告警"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="hbadge" id="bell-n" hidden>0</span></button>
  <button class="hbtn press" id="theme-btn" aria-label="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
</header>

<main class="pages" id="pages">
  <section class="page on" id="p-devices" data-page="devices" data-title="设备"></section>
  <section class="page" id="p-apps" data-page="apps" data-title="应用"></section>
  <section class="page" id="p-stats" data-page="stats" data-title="分析"></section>
  <section class="page" id="p-settings" data-page="settings" data-title="设置"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="主导航">
  <div class="tabs" id="tabs"></div>
  <div class="lens" id="lens" aria-hidden="true"><div class="lens-tint"></div><div class="lens-in" id="lens-in"></div></div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><svg id="toast-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span id="toast-t"></span></div>

<script src="hyalite.js"></script>
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/devices.js"></script>
<script src="js/apps.js"></script>
<script src="js/stats.js"></script>
<script src="js/settings.js"></script>
<script src="js/sheets.js"></script>
<script src="js/main.js"></script>
</body>
</html>
