/* ───────────────────────────────────────────────────────────────────────────
   10.7 HNC v6.1 全站按钮比例收敛、微晶克制高光与三处真机视口像素级精修
   ─────────────────────────────────────────────────────────────────────────── */
.page,
[data-style="apple"] .page,
[data-glass="liquid"] .page,
[data-glass="frosted"] .page {
  padding-bottom: calc(148px + env(safe-area-inset-bottom, 0px)) !important;
}
.hero.v6-hero {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) !important;
  gap: 11px !important;
}

/* 1) 全站按钮尺寸层级与高光克制化（覆盖 apple.css 50px/17px 与 liquid.css 999px/.55 过曝） */
.btn,
[data-style="apple"] .btn,
[data-glass="liquid"] .btn,
[data-glass="frosted"] .btn {
  height: 39px;
  padding: 0 15px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
[data-style="cyber"] .btn {
  height: 39px;
  padding: 0 14px;
  border-radius: 5px !important;
  font-size: 13px;
  font-weight: 700;
}
/* 卡片内控制区主次按钮统一 39px/12px，横幅、合并条与未知域名行保持 33px 紧凑比例 */
[data-style="apple"] .ctrl .btn,
[data-glass] .ctrl .btn,
[data-style="apple"] .scard .btns > .btn,
[data-glass] .scard .btns > .btn {
  height: 39px !important;
  font-size: 13.5px !important;
  padding: 0 14px !important;
  border-radius: 12px;
}
.mrg .btns .btn,
[data-style="apple"] .mrg .btns .btn,
.batchbar .btn,
[data-style="apple"] .batchbar .btn,
#dpi-unknown .sni-row > .btn,
.banner.thin .btn {
  height: 33px !important;
  font-size: 12.5px !important;
  padding: 0 12px !important;
  border-radius: 10px !important;
}
/* 修复 apple.css 将 .linkish 放大到 17px 导致行内操作文字喧宾夺主的问题 */
[data-style="apple"] .linkish {
  font-size: 13px;
  font-weight: 600;
}

/* 主按钮：克制哑光微晶棱边（将顶部镜面高光从 .55 压至 .24，外发光从 .65 压至 .30，彻底告别塑料糖豆感） */
[data-glass="liquid"] .btn.pri,
[data-glass="frosted"] .btn.pri,
[data-style="apple"] .btn.pri {
  background: linear-gradient(180deg, #1982FF 0%, #006CE6 100%) !important;
  color: #FFFFFF !important;
  border: 0 !important;
  box-shadow:
    inset 0 .75px 0 rgba(255, 255, 255, .24),
    inset 0 -.75px 0 rgba(0, 28, 72, .18),
    0 5px 14px -5px rgba(0, 110, 230, .30) !important;
}
:root[data-theme="dark"]:not([data-style="cyber"]) .btn.pri {
  background: linear-gradient(180deg, #1F8BFF 0%, #0A76EC 100%) !important;
  color: #FFFFFF !important;
  border: 0 !important;
  box-shadow:
    inset 0 .6px 0 rgba(255, 255, 255, .22),
    inset 0 -.6px 0 rgba(0, 18, 48, .32),
    0 6px 16px -6px rgba(10, 132, 255, .36) !important;
}

/* 次要按钮：清透低饱和嵌入式微晶填充，不再鼓成死白厚胶囊 */
[data-glass="liquid"]:not([data-theme="dark"]) .btn.sec,
[data-glass="frosted"]:not([data-theme="dark"]) .btn.sec {
  background: rgba(15, 23, 42, .055) !important;
  color: var(--blue) !important;
  border: 0 !important;
  box-shadow:
    inset 0 .75px 0 rgba(255, 255, 255, .72),
    0 0 0 .5px rgba(15, 23, 42, .085) !important;
}

/* 2) 分析页「热点设备本月排行」：在线实心绿点 + 离线空心灰圈等宽槽位对齐 + 按应用横条防挤占 */
.rk-legend {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px !important;
  color: var(--text-3);
}
.rk-idx {
  display: inline-block;
  width: 2.1ch;
  font: 700 10.5px/1 var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  margin-right: 4px;
  font-style: normal;
  flex-shrink: 0;
}
.rk-dot {
  display: inline-block;
  width: 6.5px;
  height: 6.5px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  flex-shrink: 0;
  box-sizing: border-box;
}
.rk-legend .rk-dot {
  margin-right: 1px;
  margin-left: 4px;
}
.rk-dot.on {
  background: var(--green);
  box-shadow: 0 0 6px rgba(52, 199, 89, .55);
  box-shadow: 0 0 6px color-mix(in srgb, var(--green) 55%, transparent);
}
.rk-dot.off {
  background: transparent;
  border: 1.5px solid var(--text-4);
  opacity: .82;
}
#pu-dev-rank .hbar-btn .n {
  display: inline-flex;
  align-items: center;
  min-width: 0;
}
#pu-dev-rank .hbar-btn .rk-nm {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#pu-dev-rank .hbar-btn.is-offline .rk-nm {
  color: var(--text-2);
}
#st-apps .hbar {
  grid-template-columns: minmax(74px, 1.02fr) minmax(56px, 1.12fr) auto;
  align-items: center;
}

/* 3) DPI 与自训顶部座舱：眉栏解耦 + 零孤字断行 */
.dpihero-eyebrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
}
.dpihero-eyebrow .l {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-3);
}
.dpihero-badge {
  font-size: 11.5px !important;
  padding: 3.5px 9px !important;
  border-radius: 999px !important;
}
.dpihero .top {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 10px !important;
  flex-wrap: nowrap !important;
}
.dpihero-mode-wrap {
  min-width: 0;
  flex: 1 1 auto;
}
.dpihero .mode {
  font-size: 18px !important;
  font-size: clamp(17px, 4.6vw, 20px) !important;
  font-weight: 800 !important;
  letter-spacing: -0.02em;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dpi-ring-slot {
  flex: 0 0 auto;
}
.dpi-ring-wrap {
  display: inline-flex !important;
  align-items: center !important;
  gap: 8px !important;
  flex-shrink: 0;
  white-space: nowrap;
}
.dpi-ring-svg {
  width: 42px !important;
  height: 42px !important;
  flex-shrink: 0;
}
.dpi-ring-txt {
  text-align: right;
  white-space: nowrap;
}
.dpi-ring-pct {
  font-size: 16.5px;
  font-weight: 800;
  line-height: 1.15;
  color: var(--text-1);
}
.dpi-ring-lbl {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  white-space: nowrap;
  margin-top: 1px;
}

/* 4) 本机真值常驻自训工作台：右上原理胶囊 + 对称双列主次操作钮 + 规则中心精致入口条 */
.studio-title-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.studio-title-top b {
  font-size: 15.5px;
  font-weight: 750;
  color: var(--text-1);
  letter-spacing: -0.015em;
}
.studio-badge-line {
  margin-top: 4px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.studio-guide-pill {
  flex-shrink: 0;
  height: 25px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--blue);
  background: var(--badge-acc-bg, rgba(0, 122, 255, .12));
  border: 1px solid rgba(0, 122, 255, .22);
  border: 1px solid color-mix(in srgb, var(--blue) 22%, transparent);
  white-space: nowrap;
}
.studio-actions.studio-actions-2col {
  display: grid !important;
  grid-template-columns: minmax(0, 1.22fr) minmax(0, 1fr) !important;
  gap: 9px !important;
  align-items: center !important;
  margin-top: 8px !important;
}
.studio-actions.studio-actions-2col > .btn {
  width: 100%;
  margin: 0 !important;
}
.rules-hub-callout {
  width: 100%;
  margin-top: 12px;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  cursor: pointer;
}
.rules-hub-callout .rhc-main {
  min-width: 0;
  flex: 1;
  display: grid;
  gap: 2px;
}
.rules-hub-callout .rhc-t {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-1);
}
.rules-hub-callout .rhc-s {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.4;
}
.rules-hub-callout .rhc-cta {
  flex-shrink: 0;
  height: 30px;
  padding: 0 11px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 650;
  color: var(--blue);
  background: var(--badge-acc-bg, rgba(0, 122, 255, .12));
  white-space: nowrap;
}
[data-style="cyber"] .rules-hub-callout .rhc-cta,
[data-style="cyber"] .studio-guide-pill {
  border-radius: 4px;
}

/* v6.1.0-alpha.1 设置页底部微晶构建水印条（零眩光 · 高对比双色 · 等宽对齐 · 无 Emoji） */
.foot.hnc-build-wm {
  margin: 16px auto 4px;
  padding: 6px 13px;
  width: fit-content;
  max-width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
  border-radius: 999px;
  font: 600 11px/1.4 var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--text-3);
  background: var(--lg-sub, rgba(148, 163, 184, .08));
  letter-spacing: .01em;
  user-select: text;
}
.foot.hnc-build-wm .wm-chan {
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 750;
  color: #92400e;
  background: rgba(245, 158, 11, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .foot.hnc-build-wm .wm-chan {
    color: #fbbf24;
    background: rgba(251, 191, 36, .16);
  }
}
:root[data-theme="dark"] .foot.hnc-build-wm .wm-chan {
  color: #fbbf24;
  background: rgba(251, 191, 36, .16);
}

/* v6.1.0-rc.1 零滑条 39px/12px 离散档位胶囊与 SVG 步进器 (.gx-row / .gx-pills-3 / .gx-pills-5 / .gx-step-bar / .gx-btn) */
.gx-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0 2px;
  font-size: 12px;
  color: var(--text-2);
}
.gx-pills,
.gx-pills-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  padding: 6px 0 2px;
}
.gx-pills.gx-pills-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.gx-pills-5 {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  padding: 6px 0 2px;
}
.gx-step-bar {
  display: grid;
  grid-template-columns: 39px repeat(4, minmax(0, 1fr)) 39px;
  gap: 6px;
  align-items: center;
  width: 100%;
  padding: 6px 0 2px;
}
.gx-btn {
  height: 39px;
  border-radius: 12px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--card-2);
  border: 1px solid var(--stroke);
  cursor: pointer;
  white-space: nowrap;
  min-width: 0;
  transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.gx-btn svg {
  width: 15px;
  height: 15px;
  flex: none;
}
.gx-btn.on {
  background: linear-gradient(180deg, #1982FF 0%, #006CE6 100%) !important;
  color: #FFFFFF !important;
  border-color: transparent !important;
  box-shadow: inset 0 .75px 0 rgba(255, 255, 255, .24), 0 4px 12px -4px rgba(0, 110, 230, .32);
}
[data-glass="liquid"]:not([data-theme="dark"]) .gx-btn:not(.on),
[data-glass="frosted"]:not([data-theme="dark"]) .gx-btn:not(.on) {
  background: rgba(255, 255, 255, .58);
  border: 0;
  box-shadow: inset 0 .75px 0 rgba(255, 255, 255, .82), 0 0 0 .5px rgba(15, 23, 42, .08);
}
:root[data-glass][data-theme="dark"] .gx-btn:not(.on) {
  background: rgba(30, 38, 56, .62);
  border: 0;
  box-shadow: inset 0 .75px 0 rgba(220, 238, 255, .14), 0 0 0 .5px rgba(190, 225, 255, .10);
}
:root[data-has-wp="1"][data-glass="liquid"] .gx-btn:not(.on) {
  background: var(--lg-sub-2) !important;
  border: 0 !important;
  box-shadow: var(--lg-rim-inner) !important;
}
[data-style="cyber"] .gx-btn {
  border-radius: 5px;
  font-family: var(--mono);
  background: var(--cy-sub);
  border: 1px solid var(--stroke-2);
}
[data-style="cyber"] .gx-btn.on {
  background: linear-gradient(135deg, var(--cy-accent-2), var(--indigo)) !important;
  border-color: var(--cy-accent) !important;
  color: #F8FAFC !important;
  box-shadow: 0 4px 12px -4px var(--cy-glow);
}
@media (max-width: 370px) {
  .gx-pills, .gx-pills-3, .gx-pills-5, .gx-step-bar { gap: 4px; }
  .gx-btn { font-size: 11.5px; padding: 0 3px; }
}
/* 花哨壁纸下底部撤销胶囊高对比防吃字托底 */
:root[data-has-wp="1"] .undo-pill,
html.has-wallpaper .undo-pill {
  background: rgba(250, 252, 255, .96) !important;
  border: 1px solid rgba(15, 23, 42, .12) !important;
  box-shadow: 0 16px 40px rgba(8, 16, 36, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
}
:root[data-has-wp="1"][data-theme="dark"] .undo-pill,
html.has-wallpaper[data-theme="dark"] .undo-pill {
  background: rgba(18, 22, 32, .96) !important;
  border: 1px solid rgba(255, 255, 255, .18) !important;
}
:root.lowfx .undo-pill,
:root.lowfx[data-has-wp="1"] .undo-pill,
:root.lowfx .sig-pill,
:root.lowfx .chip:not(.on),
:root.lowfx[data-has-wp="1"] .chip:not(.on),
:root.lowfx .qpill:not(.on),
:root.lowfx[data-has-wp="1"] .qpill:not(.on),
:root.lowfx .search,
:root.lowfx .seg:not(.small) {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  background: var(--card-solid) !important;
}
:root.lowfx[data-glass="frosted"] .glass,
:root.lowfx[data-glass="frosted"] .hbtn,
:root.lowfx[data-glass="frosted"] .sheet,
:root.lowfx[data-glass="frosted"] .dd-menu,
:root.lowfx[data-glass="frosted"] .tabbar,
:root.lowfx[data-glass="frosted"] .toast,
:root.lowfx[data-glass="frosted"] .v6-drawer,
:root.lowfx[data-glass="frosted"] .undo-pill {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  background: var(--card-solid) !important;
}
:root.lowfx .gx-btn:not(.on) {
  background: var(--card-2) !important;
  border: 1px solid var(--stroke) !important;
  box-shadow: none !important;
}
@media (prefers-reduced-transparency: reduce) {
  .header,
  .header::before,
  .header.hs-on::after,
  [data-glass] .header.hs-on::after {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  .glass,
  .hbtn,
  .sig-pill,
  .search,
  .seg:not(.small),
  .qpill:not(.on),
  .chip:not(.on),
  .sheet,
  .dd-menu,
  .tabbar,
  .toast,
  .v6-drawer,
  #v6-scalpel-drawer,
  .undo-pill,
  [data-glass="liquid"] .glass,
  :root[data-glass="liquid"][data-has-wp="1"] .glass:not(#tabbar):not(.seg):not(.v6-drawer):not(.sheet),
  :root[data-has-wp="1"]:not([data-style="cyber"]):not(.lowfx) .seg:not(.small),
  :root[data-has-wp="1"]:not([data-style="cyber"]):not(.lowfx) .search,
  :root[data-has-wp="1"]:not([data-style="cyber"]):not(.lowfx) .qpill:not(.on),
  :root[data-has-wp="1"]:not([data-style="cyber"]):not(.lowfx) .chip:not(.on),
  [data-glass="frosted"] .glass:not(.seg),
  [data-glass="liquid"] .v6-drawer,
  [data-glass="frosted"] .v6-drawer,
  :root[data-has-wp="1"] #tabbar.tabbar,
  :root[data-has-wp="1"] .undo-pill,
  html.has-wallpaper .undo-pill {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    background: var(--card-solid) !important;
  }
  :root[data-has-wp="1"] div.sec,
  :root[data-has-wp="1"] #apps-sub > .dsec,
  :root[data-has-wp="1"] .set-top-meta,
  :root[data-has-wp="1"] #fresh,
  :root[data-has-wp="1"] .foot.hnc-build-wm,
  :root[data-has-wp="1"] #p-stats > .wrap > .note,
  :root[data-has-wp="1"] #p-stats > .wrap > #aseg-body > .note {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  .gx-btn:not(.on),
  [data-glass="liquid"]:not([data-theme="dark"]) .gx-btn:not(.on),
  [data-glass="frosted"]:not([data-theme="dark"]) .gx-btn:not(.on),
  :root[data-glass][data-theme="dark"] .gx-btn:not(.on),
  :root[data-has-wp="1"][data-glass="liquid"] .gx-btn:not(.on) {
    background: var(--card-2) !important;
    border: 1px solid var(--stroke) !important;
    box-shadow: none !important;
  }
}
@supports not (background: color-mix(in srgb, #000 50%, transparent)) {
  :root:not([data-style]):not([data-glass="liquid"]) .header { background: var(--card-solid); }
  :root:not([data-style]):not([data-glass="liquid"]) .dn-cap .lcc-fill { background: rgba(0, 102, 224, .22); }
  :root:not([data-style]):not([data-glass="liquid"]) .up-cap .lcc-fill { background: rgba(200, 107, 234, .22); }
  :root:not([data-style]):not([data-glass="liquid"]) .tabbar { background: var(--card-solid); }
  :root:not([data-style]):not([data-glass="liquid"]) .lens { box-shadow: 0 4px 12px -3px rgba(0, 122, 255, .45); }
  [data-style="cyber"] .header { background: var(--card); }
  [data-style="cyber"] .cc-tile.on { background: var(--card-2); }
  [data-style="cyber"] .seg .thumb, [data-style="cyber"] .seg.small .thumb { background: var(--card-2); }
  [data-style="cyber"] .tabbar { background: var(--card-2); }
  [data-style="cyber"] .lens { background: rgba(56, 189, 248, .16); }
  .bw-card.dn.has-val { border-color: var(--rx); }
  .bw-card.up.has-val { border-color: var(--tx); }
  .bw-card:focus-within { box-shadow: 0 0 0 3px rgba(0, 122, 255, .18); }
  .wp-pre.on { background: var(--badge-acc-bg); }
  :root[data-style="cyber"] .toggle[aria-checked="true"] {
    background: var(--badge-ok-bg);
    box-shadow: inset 0 0 10px rgba(52, 211, 153, .24), 0 0 10px -3px rgba(52, 211, 153, .36);
  }
  .rk-dot.on { box-shadow: 0 0 6px rgba(52, 199, 89, .55); }
  .studio-guide-pill { border-color: rgba(0, 122, 255, .22); }
}
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  [data-glass="liquid"] .glass,
  [data-glass="frosted"] .glass:not(.seg),
  [data-style="cyber"] .glass,
  .header,
  .tabbar,
  .sheet,
  .v6-drawer,
  .undo-pill {
    background: var(--card-solid) !important;
  }
  [data-glass="liquid"] .header.hs-on::after,
  [data-glass="frosted"] .header.hs-on::after {
    background: var(--card-solid) !important;
  }
}

<div class="mesh" aria-hidden="true"></div><div id="hnc-wallpaper" aria-hidden="true"><div class="wp-img"></div><div class="wp-scrim"></div></div>

  <button class="hbtn press" id="theme-btn" aria-label="切换主题"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.8"/><path d="M12 3.2a8.8 8.8 0 0 1 0 17.6Z" fill="currentColor" fill-opacity=".82" stroke="none"/></svg></button>
</header>

<main class="pages" id="pages">
  <section class="page on" id="p-devices" data-page="devices" data-title="设备"></section>
  <section class="page" id="p-apps" data-page="apps" data-title="应用"></section>
  <section class="page" id="p-vector" data-page="vector" data-title="智能护航"></section>
  <section class="page" id="p-stats" data-page="stats" data-title="分析"></section>
  <section class="page" id="p-settings" data-page="settings" data-title="设置"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="主导航">
  <div class="tabs" id="tabs"></div>
  <div class="lens" id="lens" aria-hidden="true"><div class="lens-tint"></div><div class="lens-in" id="lens-in"></div></div>
</nav>

<div class="scrim" id="scrim"></div>
