<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#08090C" media="(prefers-color-scheme: dark)">
<title>HNC · Hotspot Network Control</title>
<!--
  HNC WebUI v6 (v5.11 起的新版界面)
  · 视觉: 原版统计页的设计语言 + 卡片就地展开 + 平板分栏 + 可拖动液态玻璃底栏(弹簧物理)
  · 传输: KernelSU/SukiSU WebView 里用 window.ksu.exec("curl ...") 桥接到本机 hnc_httpd 127.0.0.1:8444
          (带 X-HNC-Local-Admin 本地密钥); 远程浏览器同源 fetch + cookie, 401 → /pair 配对
  · 底栏透镜的折射/色散: Hyalite by VII-Cae (VII), MIT — https://github.com/VII-Cae/hyalite--liquid-glass
    (hyalite.js 与本页同目录; 缺失或非 Chromium 内核时自动退回模糊 + CSS 色散描边)
  · 文件: css/base.css → css/apple.css → css/liquid.css(按此顺序层叠);
          hyalite.js → js/core.js → fx → devices → apps → stats → settings → sheets → main(经典脚本,
          共享一个全局作用域, 顺序不可调换, 见 js/core.js 头注释)。全部用相对路径: KSU 管理器
          (file:// 或其内置服务)与 hnc_httpd(/css/*、/js/* 路由, Cache-Control: no-cache)都能加载。
-->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/apple.css">
<link rel="stylesheet" href="css/liquid.css">
<style id="hnc-v11-theme">
/* === HNC v5.33.1 · v11 Visual Overhaul (iOS 27 Optical Liquid Glass + Cyber Slate + Custom Wallpaper + Pure Digital Bandwidth) === */
/* ═══════════════════════════════════════════════════════════════════════════
   HNC · True iOS 27 Optical Liquid Glass & Interactive Spatial Bento System
   ═══════════════════════════════════════════════════════════════════════════ */

/* 1. Vibrant Multi-Orb Iridescent Backdrop (Static GPU Texture = 120fps + Rich Color to Refract) */
:root[data-glass="liquid"]{
  --bg:#e6eef8;
  --ap-grouped:#e6eef8;
  --text-1:#0f172a;
  --text-2:#334155;
  --text-3:#64748b;
  --text-4:#94a3b8;
  --blue:#007aff;
  --green:#28cd6f;
  --orange:#ff9500;
  --red:#ff3b30;
  --purple:#af52de;
  /* Translucent jelly-glass fills so background color fields bleed through */
  --card:rgba(255,255,255,calc(.44 + var(--gx-up,0)*.34 - var(--gx-dn,0)*.18));
  --card-2:rgba(255,255,255,calc(.62 + var(--gx-up,0)*.24 - var(--gx-dn,0)*.18));
  --lg-fill:rgba(255,255,255,calc(.36 + var(--gx-up,0)*.42 - var(--gx-dn,0)*.14));
  --lg-fill-2:rgba(248,252,255,calc(.72 + var(--gx-up,0)*.20 - var(--gx-dn,0)*.16));
  --ap-inset:rgba(255,255,255,.36);
  --input:rgba(15,23,42,.055);
  --divider:rgba(15,23,42,.06);
  --stroke:rgba(255,255,255,.55);
  /* Asymmetric 45-degree specular bevel gradient */
  --bevel-grad:linear-gradient(135deg,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.72) 18%,
    rgba(255,255,255,.12) 46%,
    rgba(255,255,255,.18) 70%,
    rgba(255,255,255,.88) 100%);
  --lg-rim:
    inset 0 1.5px 1px rgba(255,255,255,.95),
    inset 1px 0 1px rgba(255,255,255,.65),
    inset 0 -1.5px 2px rgba(140,180,235,.22),
    0 0 0 .5px rgba(255,255,255,.75);
  --lg-drop:
    0 18px 42px -18px rgba(18,42,88,.18),
    0 4px 12px -3px rgba(18,42,88,.08);
  --lg-sheen:
    radial-gradient(120% 85% at var(--spot-x,18%) var(--spot-y,0%),rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 38%,transparent 68%),
    linear-gradient(138deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.06) 35%,transparent 60%,rgba(255,255,255,.22) 100%);
}

/* Rich multi-color spatial orbs behind the glass so refraction actually has vivid colors to bend */
:root[data-glass="liquid"] .mesh{
  position:fixed!important;
  top:0!important;
  right:0!important;
  bottom:0!important;
  left:0!important;
  inset:0!important;
  animation:none!important;
  will-change:auto!important;
  filter:none!important;
  background:
    radial-gradient(46% 40% at 12% 10%,rgba(56,189,248,.42) 0%,transparent 72%),
    radial-gradient(44% 38% at 88% 16%,rgba(168,85,247,.34) 0%,transparent 72%),
    radial-gradient(50% 42% at 82% 82%,rgba(59,130,246,.36) 0%,transparent 74%),
    radial-gradient(42% 38% at 16% 84%,rgba(45,212,191,.32) 0%,transparent 72%),
    radial-gradient(36% 32% at 52% 46%,rgba(244,114,182,.22) 0%,transparent 70%),
    linear-gradient(145deg,#e2ecfb 0%,#eaf2fd 50%,#dde9f8 100%)!important;
}
:root[data-glass="liquid"] .mesh::before{
  animation:none!important;
  will-change:auto!important;
  opacity:.55!important;
}

/* 2. True Optical Glass Cards: Lightweight 12px High-Saturation Blur on Top-Level Cards + 45° Mask-Composite Bevel */
[data-glass="liquid"] .glass{
  position:relative;
  isolation:isolate;
  border:0!important;
  border-radius:26px;
  background:var(--card);
  -webkit-backdrop-filter:blur(12px) saturate(190%) brightness(1.03)!important;
  backdrop-filter:blur(12px) saturate(190%) brightness(1.03)!important;
  box-shadow:var(--lg-rim),var(--lg-drop);
}
/* Asymmetric 45-degree Specular Bevel Rim via mask-composite: xor */
[data-glass="liquid"] .glass::before{
  content:""!important;
  display:block!important;
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  inset:0;
  padding:1.25px;
  border-radius:inherit;
  background:var(--bevel-grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  z-index:2;
  opacity:.95;
}
/* Curved Optical Caustic Face Reflection */
[data-glass="liquid"] .glass:not(.seg)::after{
  content:""!important;
  display:block!important;
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  inset:0;
  border-radius:inherit;
  background:var(--lg-sheen);
  pointer-events:none;
  z-index:-1;
  opacity:.85;
}
/* Nested controls inside cards do NOT repeat backdrop-filter (keeps 120fps while looking like recessed glass wells) */
[data-glass="liquid"] .glass .chip,
[data-glass="liquid"] .sheet .chip,
[data-glass="liquid"] .v6-drawer .chip,
[data-glass="liquid"] .glass .seg,
[data-glass="liquid"] .seg.small,
[data-glass="liquid"] .seg .thumb,
[data-glass="liquid"] .seg.small .thumb,
[data-glass="liquid"] .sheet .glass{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
.dev{content-visibility:auto;contain-intrinsic-size:auto 98px}
.num,[data-rx],[data-tx],#h-dn,#h-up,#h-on,#h-total,.hero-v,.dev-rate,.lcc-val{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

/* 3. Data-Driven Ambient Edge Specular Tint (状态驱动玻璃倒角染色折射) */
[data-glass="liquid"] .dev[data-tint="online"]{--tint-rgb:0,122,255;--tint-alpha:.26}
[data-glass="liquid"] .dev[data-tint="active"]{--tint-rgb:40,205,111;--tint-alpha:.42}
[data-glass="liquid"] .dev[data-tint="shaped"]{--tint-rgb:255,149,0;--tint-alpha:.46}
[data-glass="liquid"] .dev[data-tint="blocked"]{--tint-rgb:255,59,48;--tint-alpha:.50}
[data-glass="liquid"] .dev[data-tint="online"],
[data-glass="liquid"] .dev[data-tint="active"],
[data-glass="liquid"] .dev[data-tint="shaped"],
[data-glass="liquid"] .dev[data-tint="blocked"]{
  --bevel-grad:linear-gradient(135deg,
    rgba(255,255,255,1) 0%,
    rgba(var(--tint-rgb),calc(var(--tint-alpha) * 1.15)) 26%,
    rgba(255,255,255,.14) 52%,
    rgba(var(--tint-rgb),calc(var(--tint-alpha) * .85)) 78%,
    rgba(255,255,255,.92) 100%);
  box-shadow:
    inset 0 1.5px 1px rgba(255,255,255,.96),
    inset 0 0 26px -12px rgba(var(--tint-rgb),calc(var(--tint-alpha) * .55)),
    inset 0 -1.5px 2px rgba(var(--tint-rgb),calc(var(--tint-alpha) * .35)),
    var(--lg-drop);
}
[data-glass="liquid"] .dev.open{
  background:var(--card-2);
  transform:translateY(-1px);
  box-shadow:
    inset 0 1.5px 1px #fff,
    inset 0 0 32px -10px rgba(var(--tint-rgb),.28),
    0 24px 48px -20px rgba(15,38,82,.26),
    0 4px 12px -3px rgba(15,38,82,.10);
}

/* 4. iOS 27 Control Center Interactive Spatial Bento Tiles (.cc-bento-row & .lcc-capsule) */
.cc-bento-row{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
  margin-top:2px;
}
.cc-tile{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  padding:12px 12px 11px;
  border-radius:19px;
  background:rgba(255,255,255,.46);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,.92),
    inset 0 -1px 0 rgba(255,255,255,.45),
    0 6px 16px -8px rgba(20,45,90,.14),
    0 0 0 .5px rgba(255,255,255,.72);
  text-align:left;
  transition:transform .24s cubic-bezier(.22,1.28,.36,1),background .22s ease,box-shadow .22s ease;
}
.cc-tile:disabled{opacity:.48;pointer-events:none}
.cc-orb{
  width:32px;
  height:32px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:rgba(15,23,42,.07);
  color:var(--text-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  transition:background .22s ease,color .22s ease,box-shadow .22s ease,transform .24s cubic-bezier(.22,1.3,.36,1);
}
.cc-orb svg{width:17px;height:17px}
.cc-txt{display:grid;gap:1px;min-width:0;width:100%}
.cc-txt b{font-size:12.5px;font-weight:650;color:var(--text-1);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-txt small{font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-tile.on{
  background:rgba(255,255,255,.78);
  box-shadow:
    inset 0 1.5px 1px #fff,
    0 10px 24px -10px rgba(0,122,255,.28),
    0 0 0 1px rgba(255,255,255,.9);
}
.cc-tile.on.sqm-on .cc-orb{background:linear-gradient(145deg,#34d399,#10b981);color:#fff;box-shadow:0 4px 12px -3px rgba(16,185,129,.55)}
.cc-tile.on.qos-on .cc-orb{background:linear-gradient(145deg,#60a5fa,#2563eb);color:#fff;box-shadow:0 4px 12px -3px rgba(37,99,235,.55)}
.cc-tile.on.wl-on .cc-orb{background:linear-gradient(145deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 4px 12px -3px rgba(124,58,237,.55)}

/* Interactive Control Center Liquid Rate Sliders (.lcc-capsule) */
.lcc-ctrl{gap:10px!important}


/* 5. Nested Squircle Bento Architecture (Eliminate Harsh Horizontal Divider Lines) */
[data-glass="liquid"] .ctrl{
  border-radius:20px;
  background:rgba(255,255,255,.42);
  border:0!important;
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,.88),
    inset 0 -1px 0 rgba(255,255,255,.42),
    0 6px 18px -10px rgba(20,45,90,.12),
    0 0 0 .5px rgba(255,255,255,.68);
}
.scard-rows{
  display:grid;
  gap:7px;
  padding:4px 10px 12px!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
}
.scard-rows>.row,
.scard-rows>.row-wrap{
  border-top:0!important;
  border-radius:17px!important;
  background:rgba(255,255,255,.44);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.86),
    0 3px 10px -5px rgba(20,45,90,.08),
    0 0 0 .5px rgba(255,255,255,.62);
}
.scard-rows>.row+*,
.scard-rows>.row-wrap+*{
  border-top:0!important;
}
.rows>.row+.row,.rows>.row+.row-wrap,.rows>.row-wrap+.row,.rows>.row-wrap+.row-wrap{
  border-top-color:rgba(120,145,180,.10)!important;
}

/* 6. Secondary Sheets (二级弹层): Never shrink background page; Liquid Materialize entrance */
:root.bgscaled,:root.bgscaled body{background:var(--bg)!important}
:root.bgscaled .pages{border-radius:0!important}
.header,.pages{transform:scale(1)}
.tabbar{transform:translateX(-50%) scale(1)}
@supports (scale: 1){.header,.pages,.tabbar{scale:1!important}}
[data-glass="liquid"] .scrim,
[data-glass="liquid"] .v6-drawer-scrim{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  background:rgba(12,22,42,.28)!important;
  transition:opacity .22s ease!important;
}
@media (prefers-color-scheme: dark){
  :root[data-glass="liquid"]:not([data-theme="light"]) .scrim,
  :root[data-glass="liquid"]:not([data-theme="light"]) .v6-drawer-scrim{background:rgba(2,6,16,.58)!important}
}
:root[data-glass="liquid"][data-theme="dark"] .scrim,
:root[data-glass="liquid"][data-theme="dark"] .v6-drawer-scrim{background:rgba(2,6,16,.58)!important}
:root[data-glass="frosted"] .sheet{
  background:var(--lg-fill-2);
  -webkit-backdrop-filter:blur(26px) saturate(165%);
  backdrop-filter:blur(26px) saturate(165%);
}
.fold{transition:grid-template-rows .28s cubic-bezier(.22,1,.36,1)!important}
.fold-in{transition:opacity .2s ease,transform .28s cubic-bezier(.22,1,.36,1)!important}
[data-glass="liquid"] .press{transition:transform .24s cubic-bezier(.22,1.28,.36,1),box-shadow .2s ease,background-color .2s ease}
[data-glass="liquid"] .press:active{transform:scale(.972)}

/* 7. Bottom Tabbar: Instant button highlight on touch, velocity chromatic lens */
#tabs{
  position:relative;
  z-index:2!important;
  -webkit-mask-image:none!important;
  mask-image:none!important;
}
#lens{
  z-index:1!important;
  pointer-events:none;
}
#lens-in{display:none!important}
#tabs .tab{
  transition:color .12s ease,transform .22s cubic-bezier(.22,1.35,.36,1)!important;
}
#tabs .tab.on,
#tabs .tab[aria-selected="true"]{
  color:var(--blue)!important;
  font-weight:700!important;
  transform:translateY(-1.5px);
}
#tabs .tab svg{
  transition:transform .24s cubic-bezier(.22,1.4,.36,1),color .15s ease;
}
#tabs .tab.on svg{
  transform:translateY(-1px) scale(1.1);
  filter:drop-shadow(0 4px 8px rgba(0,122,255,.32));
}
[data-glass="liquid"] .lens,
[data-glass="frosted"] .lens{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  background:
    radial-gradient(115% 95% at calc(50% + var(--lens-tilt,0) * 22%) 12%,rgba(255,255,255,.42) 0%,rgba(125,211,252,.10) 54%,rgba(0,122,255,.16) 100%);
  box-shadow:
    inset 0 1px .5px rgba(255,255,255,.52),
    inset 0 -1px 1px rgba(0,122,255,.18),
    inset 1.5px 0 2.5px rgba(244,114,182,calc(.10 + var(--lens-v,0) * 1.8)),
    inset -1.5px 0 2.5px rgba(56,189,248,calc(.12 + var(--lens-v,0) * 2.0)),
    0 4px 14px -4px rgba(18,42,88,.18);
}

/* 8. Settings Page: Level Filter Bar & Collapsible Card Stack (.scard) */
.set-top-bar{display:grid;gap:8px;margin-bottom:4px}
.set-top-meta{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.set-lv-sec{display:grid;gap:10px}
.set-lv-hd{padding-top:10px!important;padding-bottom:2px!important;font-weight:650!important;letter-spacing:.2px}
.scard-stack{display:grid;gap:11px}
.sgrp.scard{
  overflow:hidden;
  border-radius:24px;
  transition:transform .26s cubic-bezier(.22,1,.36,1),box-shadow .26s ease,background-color .26s ease;
}
[data-glass="liquid"] .sgrp.scard[data-ic-color="blue"].open{--sc-rgb:0,122,255}
[data-glass="liquid"] .sgrp.scard[data-ic-color="green"].open{--sc-rgb:40,205,111}
[data-glass="liquid"] .sgrp.scard[data-ic-color="orange"].open{--sc-rgb:255,149,0}
[data-glass="liquid"] .sgrp.scard[data-ic-color="purple"].open{--sc-rgb:175,82,222}
[data-glass="liquid"] .sgrp.scard[data-ic-color="indigo"].open{--sc-rgb:88,86,214}
[data-glass="liquid"] .sgrp.scard[data-ic-color="cyan"].open{--sc-rgb:50,173,230}
[data-glass="liquid"] .sgrp.scard[data-ic-color="teal"].open{--sc-rgb:48,176,199}
[data-glass="liquid"] .sgrp.scard[data-ic-color="red"].open{--sc-rgb:255,59,48}
[data-glass="liquid"] .sgrp.scard[data-ic-color="gray"].open{--sc-rgb:142,142,147}
[data-glass="liquid"] .sgrp.scard.open{
  background:var(--card-2);
  transform:translateY(-1px);
  --bevel-grad:linear-gradient(135deg,
    rgba(255,255,255,1) 0%,
    rgba(var(--sc-rgb,0,122,255),.55) 28%,
    rgba(255,255,255,.15) 54%,
    rgba(var(--sc-rgb,0,122,255),.42) 82%,
    rgba(255,255,255,.95) 100%);
  box-shadow:
    inset 0 1.5px 1px #fff,
    inset 0 0 28px -12px rgba(var(--sc-rgb,0,122,255),.28),
    0 18px 40px -18px rgba(20,45,88,.24);
}
.scard-h{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:15px 16px!important;
  text-align:left;
  border-radius:24px;
  background:transparent!important;
  box-shadow:none!important;
  border:0!important;
}
.scard-h .tx{flex:1;min-width:0;display:grid;gap:2px}
.scard-h b{font-size:15px;font-weight:650;color:var(--text-1);letter-spacing:-.25px}
.scard-h small{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard>.fold .fold-in{padding-top:0!important;display:block}
.scard>.fold .fold-in>div+div{margin-top:0}

/* 9. iOS 27 Crystal Water-Droplet Switch (.toggle) */
[data-glass="liquid"] .toggle{
  height:30px;
  width:52px;
  border-radius:999px;
  background:rgba(15,23,42,.14);
  box-shadow:
    inset 0 1.5px 3px rgba(15,23,42,.16),
    inset 0 -1px 0 rgba(255,255,255,.72),
    0 0 0 .5px rgba(255,255,255,.55);
  transition:background .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease;
}
[data-glass="liquid"] .toggle[aria-checked="true"]{
  background:linear-gradient(155deg,#3ce68a 0%,#1fc76a 55%,#14a857 100%);
  box-shadow:
    inset 0 1px 2px rgba(0,65,30,.24),
    inset 0 -1px 1px rgba(255,255,255,.5),
    0 4px 14px -3px rgba(31,199,106,.52);
}
[data-glass="liquid"] .toggle::after{
  top:2px;
  left:2px;
  width:26px;
  height:26px;
  border-radius:999px;
  background:radial-gradient(circle at 32% 24%,#ffffff 0%,#f5f9ff 62%,#e2eefc 100%);
  box-shadow:
    inset 0 1.5px 1px #ffffff,
    inset 0 -1.5px 2px rgba(20,48,88,.16),
    0 3px 8px rgba(15,35,68,.26),
    0 1px 2px rgba(15,35,68,.14);
  transition:
    transform .38s cubic-bezier(.22,1.32,.36,1),
    width .24s cubic-bezier(.22,1.25,.36,1),
    background .22s ease,
    box-shadow .22s ease!important;
}
[data-glass="liquid"] .toggle[aria-checked="true"]::after{
  transform:translate3d(22px,0,0);
}
[data-glass="liquid"] .toggle:active::after,
[data-glass="liquid"] .toggle.liquid-pop::after{
  width:34px;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.94) 0%,rgba(255,255,255,.28) 54%,rgba(205,235,255,.52) 100%)!important;
  box-shadow:
    inset 0 1.5px 1.5px #fff,
    inset 0 -1.5px 2px rgba(255,255,255,.8),
    inset 0 0 0 1px rgba(255,255,255,.88),
    0 6px 16px -2px rgba(15,40,80,.34),
    0 0 12px rgba(255,255,255,.65)!important;
  transform:translate3d(0,0,0) scale(1.06,1.08);
}
[data-glass="liquid"] .toggle[aria-checked="true"]:active::after,
[data-glass="liquid"] .toggle[aria-checked="true"].liquid-pop::after{
  transform:translate3d(14px,0,0) scale(1.06,1.08);
}

/* 10. Segmented Control (.seg) Mercury Droplet & Spatial Bento Hero (.hero) */
[data-glass="liquid"] .seg,
[data-glass="liquid"] .seg.glass,
[data-glass="liquid"] .seg.small{
  padding:4px;
  border-radius:999px;
  background:rgba(15,23,42,.065);
  border:0!important;
  box-shadow:
    inset 0 1.5px 3px rgba(15,23,42,.08),
    inset 0 -1px 0 rgba(255,255,255,.72),
    0 0 0 .5px rgba(255,255,255,.62);
}
[data-glass="liquid"] .seg .thumb,
[data-glass="liquid"] .seg.small .thumb{
  top:3.5px;
  bottom:3.5px;
  border-radius:999px;
  background:linear-gradient(160deg,rgba(255,255,255,.96) 0%,rgba(244,250,255,.82) 100%);
  box-shadow:
    inset 0 1.5px 1px #ffffff,
    inset 0 -1px 1.5px rgba(170,205,245,.45),
    0 4px 12px -2px rgba(20,45,88,.20),
    0 0 0 .5px rgba(255,255,255,.95);
  transform-origin:center center;
  will-change:transform,width;
  transition:transform .34s cubic-bezier(.22,1.18,.36,1),width .28s cubic-bezier(.22,1,.36,1)!important;
}
[data-glass="liquid"] .hero{
  padding:18px 18px 15px;
  border-radius:28px;
  background:
    radial-gradient(120% 90% at 10% 0%,rgba(255,255,255,.76) 0%,transparent 56%),
    radial-gradient(90% 80% at 92% 100%,rgba(0,122,255,.12) 0%,transparent 62%),
    var(--card);
}
[data-glass="liquid"] .hero:not(.v6-hero)>div:not(.hero-div):not(.hero-spark-hud){
  padding:11px 13px;
  border-radius:19px;
  background:rgba(255,255,255,.46);

}
[data-glass="liquid"] .hero-div{display:none}
[data-glass="liquid"] #h-dn{
  background:linear-gradient(165deg,#0055d4 0%,#0088ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
[data-glass="liquid"] #h-up{
  background:linear-gradient(165deg,#7928ca 0%,#a855f7 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

/* 11. Scroll-Driven Header Refraction (.header) */
[data-glass="liquid"] .header.hs-on::after{
  background:var(--card)!important;
  -webkit-backdrop-filter:blur(calc(12px + var(--hs,0) * 12px)) saturate(185%)!important;
  backdrop-filter:blur(calc(12px + var(--hs,0) * 12px)) saturate(185%)!important;
  box-shadow:
    inset 0 -1px 0 rgba(255,255,255,calc(var(--hs,0) * .88)),
    0 1px 0 rgba(30,60,110,calc(var(--hs,0) * .12)),
    0 12px 28px -14px rgba(18,40,80,calc(var(--scroll-p,0) * .20))!important;
  opacity:var(--scroll-p,0)!important;
}
@supports (background: color-mix(in srgb, #000 50%, transparent)){
  [data-glass="liquid"] .header.hs-on::after{
    background:color-mix(in srgb,var(--bg) calc(52% + var(--hs,0) * 24%),transparent)!important;
  }
}

/* 12. Dark Mode Obsidian Optical Glass & Bioluminescent Orbs */
:root[data-glass="liquid"][data-theme="dark"]{
  --bg:#070c16;
  --ap-grouped:#070c16;
  --text-1:#f1f5f9;
  --text-2:#cbd5e1;
  --text-3:#94a3b8;
  --text-4:#64748b;
  --blue:#38bdf8;
  --card:rgba(18,28,46,calc(.52 + var(--gx-up,0)*.28 - var(--gx-dn,0)*.18));
  --card-2:rgba(26,39,62,calc(.68 + var(--gx-up,0)*.20 - var(--gx-dn,0)*.16));
  --lg-fill:rgba(20,32,52,calc(.44 + var(--gx-up,0)*.38 - var(--gx-dn,0)*.14));
  --lg-fill-2:rgba(22,34,56,calc(.78 + var(--gx-up,0)*.16 - var(--gx-dn,0)*.14));
  --bevel-grad:linear-gradient(135deg,
    rgba(225,242,255,.58) 0%,
    rgba(165,210,255,.22) 22%,
    rgba(255,255,255,.03) 48%,
    rgba(120,180,255,.12) 74%,
    rgba(190,225,255,.42) 100%);
  --lg-rim:
    inset 0 1.2px 0 rgba(230,244,255,.42),
    inset 0 -1.2px 1px rgba(96,165,250,.18),
    0 0 0 .5px rgba(190,225,255,.16);
  --lg-drop:
    0 20px 46px -18px rgba(0,4,14,.78),
    0 4px 12px -3px rgba(0,6,18,.52);
  --lg-sheen:
    radial-gradient(120% 85% at var(--spot-x,18%) var(--spot-y,0%),rgba(148,197,255,.18) 0%,rgba(148,197,255,.04) 38%,transparent 68%),
    linear-gradient(138deg,rgba(215,235,255,.16) 0%,rgba(215,235,255,.03) 34%,transparent 60%,rgba(110,175,255,.10) 100%);
}
:root[data-glass="liquid"][data-theme="dark"] .mesh{

    radial-gradient(48% 42% at 80% 84%,rgba(37,99,235,.26) 0%,transparent 74%),
    radial-gradient(42% 36% at 18% 82%,rgba(16,185,129,.20) 0%,transparent 72%),

:root[data-glass="liquid"][data-theme="dark"] .hero:not(.v6-hero)>div:not(.hero-div):not(.hero-spark-hud),
:root[data-glass="liquid"][data-theme="dark"] .ctrl,
:root[data-glass="liquid"][data-theme="dark"] .cc-tile,
:root[data-glass="liquid"][data-theme="dark"] .scard-rows>.row,
:root[data-glass="liquid"][data-theme="dark"] .scard-rows>.row-wrap{

}
:root[data-glass="liquid"][data-theme="dark"] .cc-tile.on{

}
:root[data-glass="liquid"][data-theme="dark"] .lcc-capsule{

}
:root[data-glass="liquid"][data-theme="dark"] .dn-cap.active .lcc-val{color:#7dd3fc}
:root[data-glass="liquid"][data-theme="dark"] .up-cap.active .lcc-val{color:#d8b4fe}

:root[data-glass="liquid"][data-theme="dark"] #h-dn{

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
:root[data-glass="liquid"][data-theme="dark"] #h-up{
  background:linear-gradient(165deg,#e9d5ff 0%,#c084fc 100%);

  background-clip:text;

}
:root[data-glass="liquid"][data-theme="dark"] .seg .thumb,
:root[data-glass="liquid"][data-theme="dark"] .seg.small .thumb{

@media(max-width:520px){
  .cc-bento-row{gap:7px}

/* 0. 顶栏品牌标识、SVG 设备图标尺寸与响应式分栏基座（清理旧过渡样式后保留必要布局契约） */
[data-glass="liquid"] .header{height:calc(env(safe-area-inset-top,0px) + 62px);padding:calc(env(safe-area-inset-top,0px) + 9px) max(20px,calc((100vw - 1180px)/2)) 9px;gap:10px}
[data-glass="liquid"] .brand{visibility:visible;display:flex;align-items:center;gap:9px}
[data-glass="liquid"] .brand-title{font-size:20px;letter-spacing:-.6px;font-weight:750;color:var(--text-1);background:none;flex:none}
[data-glass="liquid"] .brand-sub{font-size:8px;font-weight:550;line-height:1.5;letter-spacing:.6px;white-space:normal;max-width:82px;opacity:.8}
[data-glass="liquid"] .htitle{bottom:20px;font-size:15px;letter-spacing:-.3px}
[data-glass="liquid"] .page{padding:calc(env(safe-area-inset-top,0px) + 78px) 20px calc(148px + env(safe-area-inset-bottom,0px))}
[data-glass="liquid"] .av,[data-glass="frosted"] .av{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(219,234,249,.38));box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 4px 10px -7px rgba(18,42,88,.18)}
.av>svg{width:20px;height:20px;color:#1d6fd8;stroke-width:1.75}
:root[data-theme="dark"] .av>svg{color:#60a5fa}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av>svg{color:#60a5fa}}
:root[data-glass="liquid"][data-theme="dark"] .av,:root[data-glass="frosted"][data-theme="dark"] .av{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(133,184,244,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 10px -7px rgba(0,0,0,.4)}
@media (prefers-color-scheme: dark){:root[data-glass="liquid"]:not([data-theme="light"]) .av,:root[data-glass="frosted"]:not([data-theme="light"]) .av{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(133,184,244,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 10px -7px rgba(0,0,0,.4)}}
[data-glass="liquid"] .toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 98px)}
@media (min-width:900px){
  [data-glass="liquid"] .dev-split{grid-template-columns:minmax(0,1.38fr) minmax(360px,1fr);gap:24px}
  [data-glass="liquid"] .dev-side{top:70px}
  [data-glass="liquid"] .header .brand-sub{max-width:none;font-size:9px;margin-left:4px}
}
@media (max-width:540px){
  [data-glass="liquid"] .header{padding-left:18px;padding-right:18px;height:calc(env(safe-area-inset-top,0px) + 58px)}
  [data-glass="liquid"] .page{padding-left:16px;padding-right:16px;padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
  [data-glass="liquid"] .av,[data-glass="frosted"] .av{width:42px;height:42px;border-radius:14px}
  .av>svg{width:20px;height:20px}
}

/* 1. 空间网络座舱 Hero 升级：双通道流光图 + 实时连接/峰值 HUD */
.hero-spark-hud,
[data-glass="liquid"] .hero>.hero-spark-hud,
:root[data-glass="liquid"][data-theme="dark"] .hero>.hero-spark-hud{
  grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:4px 4px 0!important;margin-top:2px;font-size:11px;color:var(--text-3);
  background:transparent!important;box-shadow:none!important;border-radius:0!important;
}
.hero-spark-hud .leg{display:inline-flex;align-items:center;gap:12px;font-weight:600}
.hero-spark-hud .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.hero-spark-hud .pills{display:inline-flex;gap:8px}

/* 2. 搜索框下方一键快捷筛选胶囊条 (.quick-pills) */
.quick-pills { display: flex; gap: 7px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scroll-padding-inline: 16px; scrollbar-width: none; -ms-overflow-style: none; }
.quick-pills::-webkit-scrollbar{display:none}
.qpill{
  display:inline-flex;align-items:center;gap:5px;height:33px;padding:0 12px;border-radius:999px;
  font-size:12px;font-weight:600;white-space:nowrap;color:var(--text-2);
  background:rgba(255,255,255,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 2px 8px -4px rgba(20,45,90,.1),0 0 0 .5px rgba(255,255,255,.68);
  transition:transform .22s var(--q),background .2s ease,color .2s ease,box-shadow .2s ease;
}
:root[data-theme="dark"] .qpill{
  background:rgba(16,26,44,.56);
  box-shadow:inset 0 1px 0 rgba(220,238,255,.16),0 0 0 .5px rgba(190,225,255,.14);
}
.qpill b{
  font:650 10.5px var(--font);padding:1px 6px;border-radius:999px;
  background:rgba(15,23,42,.07);color:var(--text-3);
}
:root[data-theme="dark"] .qpill b{background:rgba(255,255,255,.1)}
.qpill.on{
  background:linear-gradient(165deg,#399cff,#0b7bf3);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px -5px rgba(0,122,255,.52);
}
.qpill.on b{background:rgba(255,255,255,.24);color:#fff}

/* 3. 设备卡片实时带宽微型负载条 (.dev-load-bar) */
.dev-load-bar{
  width:58px;height:4px;border-radius:999px;background:rgba(15,23,42,.08);overflow:hidden;margin-top:3px;
}
:root[data-theme="dark"] .dev-load-bar{background:rgba(255,255,255,.12)}
.dev-load-bar i{
  display:block;height:100%;border-radius:inherit;
  background:linear-gradient(90deg,var(--rx),var(--tx));transition:width .35s ease;
}

/* 4. iOS 27 控制中心 4 磁贴矩阵升级 (.cc-bento-row 4列) */
.cc-bento-row.bento-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:480px){.cc-bento-row.bento-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cc-tile.conn-tile .cc-orb{
  background:linear-gradient(145deg,#fb923c,#ea580c);color:#fff;
  box-shadow:0 4px 12px -3px rgba(234,88,12,.45);
}
.lcc-auto-badge{
  font-size:10px;font-weight:650;padding:2px 8px;border-radius:999px;
  background:rgba(0,122,255,.12);color:var(--blue);cursor:pointer;user-select:none;
}
.lcc-auto-badge.off{background:var(--input);color:var(--text-3)}

/* 5. 应用页：流量构成彩条 (.app-cat-card) & 分析页：DPI 环形覆盖率仪表 (.dpi-ring) */
.app-cat-card{padding:14px 16px;display:grid;gap:8px;margin-bottom:4px}
.app-cat-bar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--input);gap:1.5px}
.app-cat-bar i{display:block;height:100%}
.app-cat-leg{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11px;color:var(--text-2)}
.app-cat-leg span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.app-cat-leg i{width:7px;height:7px;border-radius:50%;display:inline-block}
.dpi-ring-wrap{display:flex;align-items:center;gap:10px}
.dpi-ring-svg{width:46px;height:46px;transform:rotate(-90deg)}

/* ───────────────────────────────────────────────────────────────────────────
   PART 1 · 全量扫描结构与布局 Bug 修复（跨主题通用）
   ─────────────────────────────────────────────────────────────────────────── */

/* 1. 彻底锁死内联设备 SVG 图标尺寸，根治 DPI 页及任意文本行内 SVG 撑爆卡片的 Bug */
.dev-svg{
  width:15px;
  height:15px;
  display:inline-block;
  vertical-align:-2.5px;
  flex:none;
  color:var(--blue);
}
.av>.dev-svg,.av>svg{
  width:20px;
  height:20px;
  display:block;
  vertical-align:0;
}
.side-head .av>.dev-svg,.side-head .av>svg{
  width:22px;
  height:22px;
}
@media (max-width:540px){
  .av>.dev-svg,.av>svg{width:20px;height:20px}
}

/* 2. 修复分段滑块 (.seg) 果冻形变越界引发页面瞬时横向滚动条的问题 */
.seg{
  overflow:hidden;
}

/* 3. 修复液态玻璃隐藏 .hero-div 后「设备页 Hero」与「应用页 .ahero .stats」列宽挤压成 1px 的 Bug */
[data-glass="liquid"] .hero:not(.v6-hero){
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
}
[data-glass="liquid"] .ahero .stats,
[data-style="cyber"] .ahero .stats{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
}
[data-glass="liquid"] .ahero .stats>.hero-div,
[data-style="cyber"] .ahero .stats>.hero-div{
  display:none;
}
[data-glass="liquid"] .ahero .stats>div:not(.hero-div){
  padding:10px 11px;
  border-radius:16px;
  background:rgba(255,255,255,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 3px 10px -6px rgba(20,45,90,.10),0 0 0 .5px rgba(255,255,255,.65);
}
:root[data-glass="liquid"][data-theme="dark"] .ahero .stats>div:not(.hero-div){
  background:rgba(12,20,34,.48);
  box-shadow:inset 0 1px 0 rgba(220,238,255,.16),0 0 0 .5px rgba(190,225,255,.12);
}
@media (max-width:440px){
  [data-glass="liquid"] .ahero .stats,
  [data-style="cyber"] .ahero .stats,
  :root:not([data-style]):not([data-glass="liquid"]) .ahero .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }
  :root:not([data-style]):not([data-glass="liquid"]) .ahero .stats>.hero-div{
    display:none;
  }
}

/* 4. 修复手机端设备卡片第 2 行元数据（连接数 · 今日在线 · 本月配额）被单行截断看不见的问题 */
@media (max-width:560px){
  .dev-info .dev-meta:not(.mono){
    white-space:normal;
    line-height:1.45;
    display:-webkit-box!important;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
}

/* 5. 补齐 .gi.indigo 渐变与带宽预设胶囊单行自适应布局 */
.gi.indigo{--a:var(--indigo);--b:var(--purple)}
.lcc-pills{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:6px;
}
@media (max-width:440px){
  .lcc-pills{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.lcc-pill{
  min-width:0;
  padding:0 4px;
  font-size:11px;
  white-space:nowrap;
  text-align:center;
}
.lcc-fill{border-radius:4px}

/* 6. 重构 DPI 分析页「活跃设备」与「设备画像」Bento 卡片结构（紧凑头像 + 指标胶囊 + 置信度条） */
#disc-entry{margin-top:0!important}
.dpi-client-card{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:11px;
  padding:13px 15px;
  align-items:flex-start;
  transition:background .2s ease;
}
.dpi-client-card+.dpi-client-card{
  border-top:1px solid var(--divider);
}
.dpi-dev-av{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--input);
  border:1px solid var(--stroke);
  color:var(--blue);
  flex:none;
  margin-top:1px;
}
.dpi-dev-av svg{width:20px;height:20px}
.dpi-dev-main{min-width:0;display:grid;gap:4px}
.dpi-dev-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpi-dev-nm{font-weight:700;font-size:14.5px;color:var(--text-1);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpi-dev-id{font-size:12px;color:var(--text-2);font-weight:500}
.dpi-meta-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:1px}
.dpi-mpill{
  font:600 10.5px var(--mono);
  padding:2px 7px;
  border-radius:6px;
  background:var(--input);
  color:var(--text-2);
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.dpi-mpill.sni{color:var(--purple)}
.dpi-conf-wrap{display:inline-flex;align-items:center;gap:6px}
.dpi-conf-track{width:46px;height:5px;border-radius:99px;background:var(--input);overflow:hidden}
.dpi-conf-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--green))}

/* ───────────────────────────────────────────────────────────────────────────
   PART 2 · 缺失动效全量补齐（筛选切换 · 子视图转场 · 仪表生长 · 磁贴脉冲）
   ─────────────────────────────────────────────────────────────────────────── */
@keyframes hncSoftRise{
  from{opacity:0;transform:translate3d(0,8px,0) scale(.992)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
@keyframes hncOrbPulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
@keyframes hncPillPop{
  0%{transform:scale(.93)}
  55%{transform:scale(1.04)}
  100%{transform:scale(1)}
}
.fx-rise{
  animation:hncSoftRise .24s cubic-bezier(.22,1,.36,1) both;
}
.qpill.on{
  animation:hncPillPop .26s cubic-bezier(.22,1.35,.36,1);
}
.cc-tile.pulse .cc-orb{
  animation:hncOrbPulse .32s cubic-bezier(.22,1.4,.36,1);
}
.app-cat-bar i{
  transform-origin:left center;
  animation:growX .65s cubic-bezier(.22,1,.36,1) both;

/* ───────────────────────────────────────────────────────────────────────────
   PART 5 · 纯数字精准带宽限速面板 (.bw-ctrl) & 展开态元数据防裁剪

}

/* ───────────────────────────────────────────────────────────────────────────
   PART 6 · 自定义背景壁纸光学引擎 (#hnc-wallpaper · 保留 100% Hyalite 真折射)
   ─────────────────────────────────────────────────────────────────────────── */
#hnc-wallpaper{
  display:none;
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  left:0;
  inset:0;
  z-index:-1;
  pointer-events:none;
  overflow:hidden;
}
html{
  background:var(--bg)!important;
}
:root[data-has-wp="1"] #hnc-wallpaper{
  display:block;
}
:root[data-has-wp="1"] body{
  background:transparent!important;
}
/* 移除液态玻璃 .mesh 原本不透明的底部渐变，使底层自定义壁纸直接进入 Hyalite SVG 位移折射管线 */
:root[data-has-wp="1"][data-glass="liquid"] .mesh{
  background:
    radial-gradient(44% 38% at 14% 12%,rgba(56,189,248,.16) 0%,transparent 70%),
    radial-gradient(44% 38% at 86% 84%,rgba(168,85,247,.14) 0%,transparent 70%)!important;
  opacity:.55!important;
}
:root[data-has-wp="1"]:not([data-glass="liquid"]) .mesh{
  opacity:.32!important;
}
/* 默认与赛博风格开启壁纸时，卡片自动切换为半透明磨砂透景材质 */
:root[data-has-wp="1"]:not([data-style]):not([data-glass="liquid"]) .glass{
  background:rgba(255,255,255,.76);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
}
:root[data-has-wp="1"][data-theme="dark"]:not([data-style]):not([data-glass="liquid"]) .glass{
  background:rgba(17,24,39,.76);
}
:root[data-has-wp="1"][data-style="cyber"] .glass{
  background:rgba(228,236,245,.78);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
}
:root[data-has-wp="1"][data-style="cyber"][data-theme="dark"] .glass{
  background:rgba(15,22,32,.78);
}
#hnc-wallpaper .wp-img{
  position:absolute;
  top:0!important;
  right:0!important;
  bottom:0!important;
  left:0!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  background-image:var(--wp-image,none);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  filter:blur(var(--wp-blur,0px));
  transform:scale(1.05) translateZ(0)!important;
  transition:none!important;
}
#hnc-wallpaper .wp-scrim{
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  inset:0;
  background:rgba(242,247,255,var(--wp-dim,.28));
  transition:background .25s ease;
}
/* 1) 无界原生排版（默认 adaptive）：彻底取消 .page::before / div.sec / #fresh 的实心白底膏药条，按三区壁纸明暗自适应字色与光学微衬影 */
:root[data-has-wp="1"] .page::before,
html.has-wallpaper .page::before{
  background:transparent;
  box-shadow:none;
}
:root[data-has-wp="1"]:not([data-wp-top="light"]) .page::before,
html.has-wallpaper:not([data-wp-top="light"]) .page::before,
:root[data-has-wp="1"][data-theme="dark"] .page::before,
html.has-wallpaper[data-theme="dark"] .page::before{
  color:#F8FAFC!important;
  text-shadow:0 1px 3px rgba(4,10,24,.50),0 4px 16px rgba(4,10,24,.26)!important;
}
:root[data-has-wp="1"][data-wp-top="light"]:not([data-theme="dark"]) .page::before,
html.has-wallpaper[data-wp-top="light"]:not([data-theme="dark"]) .page::before{
  color:#09111F!important;
  text-shadow:0 1px 8px rgba(255,255,255,.45)!important;
}
:root[data-style="apple"][data-has-wp="1"]:not([data-wp-top="light"]) .header:not(.hs-on) .brand-title,
:root[data-style="apple"][data-has-wp="1"]:not([data-wp-top="light"]) .header:not(.hs-on) .brand-sub,
:root[data-style="apple"][data-has-wp="1"]:not([data-wp-top="light"]) .header:not(.hs-on) .htitle{
  color:#F8FAFC!important;
  text-shadow:0 1px 3px rgba(4,10,24,.46)!important;
}
:root[data-has-wp="1"]:not([data-wp-tone="light"]) div.sec,
html.has-wallpaper:not([data-wp-tone="light"]) div.sec,
:root[data-has-wp="1"]:not([data-wp-tone="light"]) #fresh,
html.has-wallpaper:not([data-wp-tone="light"]) #fresh,
:root[data-has-wp="1"][data-theme="dark"] div.sec,
:root[data-has-wp="1"][data-theme="dark"] #fresh{
  color:rgba(248,250,252,.95)!important;
  font-weight:600!important;
  text-shadow:0 1px 3px rgba(4,10,24,.54),0 3px 12px rgba(4,10,24,.28)!important;
}
:root[data-has-wp="1"]:not([data-wp-tone="light"]) div.sec small,
:root[data-has-wp="1"]:not([data-wp-tone="light"]) div.sec .r,
:root[data-has-wp="1"][data-theme="dark"] div.sec small,
:root[data-has-wp="1"][data-theme="dark"] div.sec .r{
  color:rgba(226,232,240,.86)!important;
}
:root[data-has-wp="1"]:not([data-wp-tone="light"]) div.sec .linkish{
  color:#7dd3fc!important;
}
:root[data-has-wp="1"][data-wp-tone="light"]:not([data-theme="dark"]) div.sec,
:root[data-has-wp="1"][data-wp-tone="light"]:not([data-theme="dark"]) #fresh{
  color:#0F172A!important;
  font-weight:600!important;
  text-shadow:0 1px 6px rgba(255,255,255,.46)!important;
}
:root[data-has-wp="1"][data-wp-tone="light"]:not([data-theme="dark"]) div.sec:not([data-bt-zone]) small,
:root[data-has-wp="1"][data-wp-tone="light"]:not([data-theme="dark"]) div.sec:not([data-bt-zone]) .r{
  color:rgba(15,23,42,.76)!important;
}
@media (prefers-color-scheme: dark){
  :root[data-has-wp="1"]:not([data-theme="light"]) .page::before{
    color:#F8FAFC!important;
    text-shadow:0 1px 3px rgba(4,10,24,.54),0 4px 16px rgba(4,10,24,.30)!important;
  }
  :root[data-has-wp="1"]:not([data-theme="light"]) div.sec,
  :root[data-has-wp="1"]:not([data-theme="light"]) #fresh{
    color:rgba(248,250,252,.95)!important;
    text-shadow:0 1px 3px rgba(4,10,24,.56),0 3px 12px rgba(4,10,24,.30)!important;
  }
  :root[data-has-wp="1"]:not([data-theme="light"]) div.sec small,
  :root[data-has-wp="1"]:not([data-theme="light"]) div.sec .r{
    color:rgba(226,232,240,.86)!important;
  }
}

/* 2) 可选模式 B（data-wp-text="capsule"）：无白边轻纱微托底（告别实心纯白膏药条） */
:root[data-has-wp="1"][data-wp-text="capsule"][data-style="apple"] .page::before{
  width:fit-content;
  max-width:none;
  margin-left:max(0px,calc((100% - 640px)/2));
  margin-right:auto;
  margin-bottom:8px;
  padding:3px 14px 5px;
  border-radius:16px;
  font-size:28px;
  background:rgba(10,18,32,.26);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
}
@media (min-width:900px){
  :root[data-has-wp="1"][data-wp-text="capsule"][data-style="apple"] .page::before{
    margin-left:max(0px,calc((100% - 1180px)/2));
  }
}
:root[data-has-wp="1"][data-wp-text="capsule"] div.sec{
  padding:4px 12px!important;
  margin-top:4px;
  margin-bottom:2px;
  border-radius:12px;
  background:rgba(10,18,32,.24);
  -webkit-backdrop-filter:blur(14px) saturate(175%);
  backdrop-filter:blur(14px) saturate(175%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
}
:root[data-has-wp="1"][data-wp-text="capsule"] #fresh{
  width:fit-content;
  margin:2px auto 0;
  padding:2px 11px;
  border-radius:999px;
  background:rgba(10,18,32,.24);
  -webkit-backdrop-filter:blur(14px) saturate(175%);
  backdrop-filter:blur(14px) saturate(175%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
}
:root[data-has-wp="1"][data-wp-text="capsule"][data-wp-tone="light"]:not([data-theme="dark"])[data-style="apple"] .page::before,
:root[data-has-wp="1"][data-wp-text="capsule"][data-wp-tone="light"]:not([data-theme="dark"]) div.sec,
:root[data-has-wp="1"][data-wp-text="capsule"][data-wp-tone="light"]:not([data-theme="dark"]) #fresh{
  background:rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32);
}

#dpi-unknown{padding:6px 0}
#dpi-unknown .sni-row .c{display:block;white-space:normal;overflow-wrap:anywhere}
#dpi-unknown .sni-row>.btn,#dpi-unknown .sni-row>.badge,#dpi-unknown .sni-row>.wp-mpill{flex:none}
#dpi-unknown .sni-row>.btn{height:32px;padding:0 11px;font-size:12.5px;border-radius:999px}
.wp-mode-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:2px 0 4px;
}
.wp-mode-pills{
  display:inline-flex;
  gap:5px;
}
.wp-mpill{
  font-size:11.5px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  background:var(--card-2);
  border:1px solid var(--stroke);
  color:var(--text-2);
}
.wp-mpill.on{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #hnc-wallpaper .wp-scrim{
    background:rgba(6,10,18,var(--wp-dim,.38));
  }
}
:root[data-theme="dark"] #hnc-wallpaper .wp-scrim{
  background:rgba(6,10,18,var(--wp-dim,.38));
}

/* 设置页自定义壁纸选择器 UI */
.wp-panel{
  display:grid;
  gap:9px;
  padding:10px 0 4px;
  border-top:1px solid var(--divider);
  margin-top:2px;
}
.wp-presets{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
@media (max-width:460px){
  .wp-presets{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.wp-pre{
  display:grid;
  justify-items:center;
  gap:5px;
  padding:6px 4px;
  border-radius:10px;
  background:var(--input);
  border:1.5px solid transparent;
  font-size:11.5px;
  font-weight:600;
  color:var(--text-2);
  transition:transform .18s var(--q),border-color .18s ease,color .18s ease;
}
.wp-pre.on{
  border-color:var(--blue);
  color:var(--blue);
  background:var(--badge-acc-bg);
  background:color-mix(in srgb,var(--blue) 10%,var(--input));
}
.wp-sw{
  width:100%;
  height:34px;
  border-radius:7px;
  background-size:cover;
  background-position:center;
  border:1px solid var(--stroke);
}
.wp-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.wp-actions .box{
  flex:1;
  min-width:160px;
  height:39px;
  border-radius:12px;
}
.wp-actions .btn{
  height:36px;
  padding:0 12px;
  font-size:12.5px;
}
.wp-sliders{
  display:grid;
  gap:6px;
  padding:8px 10px;
  border-radius:10px;
  background:var(--input);
}

/* === HNC v5.34 Next-Gen Foreground Intent Capsule, Companion Pill & Dual-Stack Bar === */
.fg-intent-box { display:flex; flex-direction:column; gap:7px; padding:10px 12px; margin:2px 0 10px; border-radius:14px; background:rgba(120,145,180,.07); border:1px solid rgba(130,155,190,.16); }
[data-theme="dark"] .fg-intent-box { background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.09); }
.fg-intent-top { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:13px; line-height:1.35; }
.fg-scr-dot { width:8px; height:8px; border-radius:50%; flex:0 0 8px; background:#94a3b8; }
.fg-scr-dot.active { background:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,.20); }
.fg-scr-dot.idle_audio { background:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.20); }
.fg-scr-dot.doze { background:transparent; border:1.6px solid #94a3b8; }
.fg-ev-tag { display:inline-flex; align-items:center; padding:1px 6px; border-radius:999px; font-size:10.5px; font-weight:600; color:var(--accent,#007AFF); background:rgba(0,122,255,.09); border:.5px solid rgba(0,122,255,.22); white-space:nowrap; }
.fg-ev-tag.warn { color:#d97706; background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.35); }
[data-theme="dark"] .fg-ev-tag { color:#60a5fa; background:rgba(96,165,250,.13); border-color:rgba(96,165,250,.28); }
.fg-comp-pill { display:inline-flex; align-items:center; gap:4px; padding:1.5px 7px; border-radius:999px; font-size:11px; font-weight:500; color:#7c3aed; background:rgba(124,58,237,.10); border:.5px solid rgba(124,58,237,.24); white-space:nowrap; }
[data-theme="dark"] .fg-comp-pill { color:#c4b5fd; background:rgba(139,92,246,.16); border-color:rgba(139,92,246,.30); }
.fg-ds-wrap { display:flex; flex-direction:column; gap:4px; }
.fg-ds-meta { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-2,#64748b); }
.fg-ds-bar { height:4px; border-radius:99px; overflow:hidden; display:flex; background:rgba(14,165,233,.28); }
.fg-ds-bar > i { display:block; height:100%; background:linear-gradient(90deg,#6366f1,#06b6d4); transition:width .3s ease; }
.fg-ds-bar.is-escape > i { background:repeating-linear-gradient(45deg,#ef4444,#ef4444 5px,#f59e0b 5px,#f59e0b 10px); }
.dev-apps .fg-mini-tag { display:inline-block; padding:0 5px; margin-left:3px; border-radius:6px; font-size:10px; font-weight:600; color:var(--accent,#007AFF); background:rgba(0,122,255,.08); vertical-align:1px; }

/* === HNC v5.35.0 · Issue #1 & #2 Full Optical Overhaul + 3D Glass Icons + Self-Capture Studio === */

/* 1) 根元素常驻 var(--bg) 防全透明穿底，仅 body 透明以透出 z-index:-1 的 #hnc-wallpaper */
html,
html[data-has-wp="1"],
html.has-wallpaper{
  background:var(--bg)!important;
}
html[data-has-wp="1"] body,
html.has-wallpaper body{
  background:transparent!important;
}
:root.has-wallpaper #hnc-wallpaper{
  display:block;
}
/* 解除 .dev 的 content-visibility:auto 绘制遏制，根治移动端 Chromium/WebView 下 .dev / .dev.open backdrop-filter 采样失效 */
:root[data-glass] .dev,
:root[data-has-wp="1"] .dev,
html.has-wallpaper .dev,
.dev.open{
  content-visibility:visible!important;
  contain:none!important;
}

/* 2) 壁纸遮罩层去奶白化：保留冰霜树枝/风景壁纸的明暗反差与冷色折射信噪比 */
#hnc-wallpaper .wp-scrim{
  background:rgba(236,244,255,calc(var(--wp-dim,.18) * .52))!important;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #hnc-wallpaper .wp-scrim{
    background:rgba(4,9,20,calc(var(--wp-dim,.28) * .82))!important;
  }
}
:root[data-theme="dark"] #hnc-wallpaper .wp-scrim{
  background:rgba(4,9,20,calc(var(--wp-dim,.28) * .82))!important;
}

/* 3) iOS 27 光学液态玻璃分层参数（浅色模式 · 无壁纸光斑态 & 壁纸激活态） */
:root[data-glass="liquid"],
:root[data-glass="frosted"]{
  --card:rgba(255,255,255,calc(.32 + var(--gx-up,0)*.34 - var(--gx-dn,0)*.16));
  --card-2:rgba(255,255,255,calc(.40 + var(--gx-up,0)*.32 - var(--gx-dn,0)*.18));
  --lg-fill:rgba(255,255,255,calc(.24 + var(--gx-up,0)*.36 - var(--gx-dn,0)*.14));
  --lg-fill-2:rgba(248,252,255,calc(.52 + var(--gx-up,0)*.28 - var(--gx-dn,0)*.20));
  --lg-sub:rgba(255,255,255,calc(.22 + var(--gx-up,0)*.24 - var(--gx-dn,0)*.12));
  --lg-sub-2:rgba(255,255,255,calc(.26 + var(--gx-up,0)*.22 - var(--gx-dn,0)*.12));
  --lg-tile-on:rgba(255,255,255,calc(.46 + var(--gx-up,0)*.26 - var(--gx-dn,0)*.18));
  --lg-blur:calc(16px + var(--gx-up,0)*8px - var(--gx-dn,0)*6px);
  --lg-rim:
    inset 0 1px .5px rgba(255,255,255,.88),
    inset 1px 0 .5px rgba(255,255,255,.46),
    inset 0 -1px 1.5px rgba(125,175,245,.26),
    0 0 0 .5px rgba(255,255,255,.62);
  --lg-rim-inner:
    inset 0 1px 0 rgba(255,255,255,.72),
    inset 0 -1px 0 rgba(140,180,235,.18),
    0 0 0 .5px rgba(255,255,255,.48);
  --lg-drop:
    0 16px 38px -16px rgba(15,35,75,.18),
    0 4px 12px -3px rgba(15,35,75,.08);
  --lg-sheen:
    radial-gradient(95% 52% at var(--spot-x,18%) var(--spot-y,0%),rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 34%,transparent 60%),
    linear-gradient(155deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,0) 32%,transparent 74%,rgba(255,255,255,.08) 100%);
}

:root[data-has-wp="1"][data-glass="liquid"],
html.has-wallpaper[data-glass="liquid"],
:root[data-has-wp="1"][data-glass="frosted"],
html.has-wallpaper[data-glass="frosted"]{
  --text-1:#09111f;
  --text-2:rgba(15,23,42,.88);
  --text-3:rgba(30,41,59,.78);
  --stroke:rgba(255,255,255,.18);
  --card:rgba(248,251,255,calc(.28 + var(--gx-up,0)*.34 - var(--gx-dn,0)*.14));
  --card-2:rgba(248,251,255,calc(.34 + var(--gx-up,0)*.34 - var(--gx-dn,0)*.16));
  --lg-fill:rgba(248,251,255,calc(.20 + var(--gx-up,0)*.34 - var(--gx-dn,0)*.10));
  --lg-fill-2:rgba(246,251,255,calc(.48 + var(--gx-up,0)*.30 - var(--gx-dn,0)*.18));
  --lg-sub:rgba(255,255,255,calc(.18 + var(--gx-up,0)*.24 - var(--gx-dn,0)*.10));
  --lg-sub-2:rgba(255,255,255,calc(.20 + var(--gx-up,0)*.22 - var(--gx-dn,0)*.10));
  --lg-tile-on:rgba(255,255,255,calc(.38 + var(--gx-up,0)*.26 - var(--gx-dn,0)*.16));
  /* 无界微晶边缘：仅顶部极细高光 (.22) 自然衰减至底部透明，彻底消灭全周 .5px 粉笔白外描边 */
  --bevel-grad:linear-gradient(180deg,
    rgba(255,255,255,.22) 0%,
    rgba(255,255,255,.07) 28%,
    rgba(255,255,255,.01) 64%,
    rgba(255,255,255,0) 100%);
  --lg-rim:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 1px rgba(8,18,38,.08);
  --lg-rim-inner:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(8,18,38,.05);
  --lg-drop:
    0 16px 38px -14px rgba(6,14,32,.28),
    0 4px 12px -3px rgba(6,14,32,.14);
  --lg-sheen:
    radial-gradient(90% 48% at var(--spot-x,18%) var(--spot-y,0%),rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 34%,transparent 58%),
    linear-gradient(180deg,rgba(255,255,255,.12) 0%,transparent 34%);
}

/* 5) 顶层卡片、展开容器与嵌套子层全链路通透化 */
:root[data-glass="liquid"] .glass{
  background:var(--card);
  -webkit-backdrop-filter:blur(var(--lg-blur)) saturate(205%) contrast(1.04) brightness(.99)!important;
  backdrop-filter:blur(var(--lg-blur)) saturate(205%) contrast(1.04) brightness(.99)!important;
  box-shadow:var(--lg-rim),var(--lg-drop);
}
@media (prefers-color-scheme: dark){
  :root[data-glass="liquid"]:not([data-theme="light"]) .glass{
    -webkit-backdrop-filter:blur(var(--lg-blur)) saturate(195%) contrast(1.06) brightness(.96)!important;
    backdrop-filter:blur(var(--lg-blur)) saturate(195%) contrast(1.06) brightness(.96)!important;
  }
}
:root[data-glass="liquid"][data-theme="dark"] .glass{
  -webkit-backdrop-filter:blur(var(--lg-blur)) saturate(195%) contrast(1.06) brightness(.96)!important;

:root[data-glass="liquid"] .v6-fw-btn:not(.on),

/* ═══════════════════════════════════════════════════════════════════════════
   PART 7 · 四大视觉模式专属 120fps 物理与动效引擎 (v5.35 Motion & Physics Overhaul)
   覆盖：Liquid Glass · Frosted · Default · Cyber | 严守 .page 零水平漂移与零 Backdrop-Root 破坏
   ═══════════════════════════════════════════════════════════════════════════ */

/* 7.0 工业级 GPU 注册变量与 .page 绝对零漂移 / 零 Backdrop-Root 防护墙 */
@property --spot-x{syntax:'<percentage>';inherits:true;initial-value:18%}
@property --spot-y{syntax:'<percentage>';inherits:true;initial-value:0%}
@property --spot-a{syntax:'<number>';inherits:true;initial-value:0.30}

.page,
.page.on{
  transform:none!important;
  filter:none!important;
  opacity:1!important;
  overflow-x:clip!important;
}

/* 消除旧版 .seg.jelly CSS scale 与 JS WAAPI transform 双重叠加冲突 */
.seg.jelly .thumb{
  animation:none!important;
}

/* 7.1 底部弹层 (#sheet) 外层不滚动 + 内层 #sheet-body 独立滚动 + #v6-scalpel-drawer 固定定位与层级栈 */
#v6-scalpel-scrim{
  position:fixed!important;
  z-index:80;
}
#v6-scalpel-drawer{
  position:fixed!important;
  z-index:81!important;
}
#scrim.scrim,
.scrim{
  z-index:82;
  will-change:opacity;
}
#sheet.sheet,
.sheet{
  z-index:83;
  overflow:hidden!important;
  display:flex;
  flex-direction:column;
  transform:translate3d(-50%,calc(100% + 40px),0);
  opacity:1;
  visibility:hidden;
  will-change:transform;
  transition:transform .26s var(--q,cubic-bezier(.16,1,.3,1)),opacity .18s ease,visibility 0s .26s;
}
#sheet.sheet.show,
.sheet.show{
  transform:translate3d(-50%,0,0);
  opacity:1;
  visibility:visible;
  transition:transform .26s var(--q,cubic-bezier(.16,1,.3,1)),opacity .18s ease,visibility 0s;
}
#sheet-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.sheet.closing{
  visibility:visible!important;
  opacity:1!important;
  pointer-events:none!important;
}
.sheet.is-dragging,
.sheet.is-spring{
  transition:none!important;
}
.sheet .grab{
  flex:none;
  transition:transform .2s cubic-bezier(.22,1,.36,1),background-color .2s ease;
}
.sheet.is-dragging .grab{
  transform:scaleX(1.22);
  background:var(--blue);
}
.sheet .al-foot-btns{
  position:sticky;
  bottom:0;
  z-index:4;
  margin-top:12px;
  padding:10px 0 2px;
  background:var(--card-solid);
  border-top:1px solid var(--divider);
}
[data-glass] .sheet .al-foot-btns,
:root[data-has-wp="1"]:not([data-style="cyber"]) .sheet .al-foot-btns{
  background:rgba(248,251,255,.94);
}
:root[data-theme="dark"] .sheet .al-foot-btns{
  background:rgba(24,26,34,.94);
}
:root.modal-open .page::before,
body:has(#sheet.show) .page::before,
body:has(#v6-scalpel-drawer.show) .page::before{
  opacity:0!important;
  visibility:hidden!important;
}

/* ───────────────────────────────────────────────────────────────────────────
   7.2 模式一：液态玻璃 (:root[data-glass="liquid"])
       水滴表面张力微形变 · 晶莹水滴拨动 · 卡片微倾与流转高光 · 丝滑阻尼展开
   ─────────────────────────────────────────────────────────────────────────── */
/* 修复旧版 :root 词法作用域导致 .glass 上 --spot-x/--spot-y 永远失效的 Bug */
:root[data-glass="liquid"] .glass:not(.seg)::after{
  --spot-a:.30;
  background:
    radial-gradient(96% 58% at var(--spot-x,18%) var(--spot-y,0%),rgba(255,255,255,var(--spot-a,.30)) 0%,rgba(255,255,255,.07) 36%,transparent 64%),
    linear-gradient(155deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,0) 32%,transparent 74%,rgba(255,255,255,.08) 100%)!important;

}
:root[data-glass="liquid"] .glass.is-spotting:not(.seg)::after{

@media (prefers-color-scheme: dark){

  }
  :root[data-glass="liquid"]:not([data-theme="light"]) .glass.is-spotting:not(.seg)::after{

}
:root[data-glass="liquid"][data-theme="dark"] .glass:not(.seg)::after{

    radial-gradient(96% 58% at var(--spot-x,18%) var(--spot-y,0%),rgba(156,208,255,var(--spot-a,.15)) 0%,rgba(148,197,255,.035) 36%,transparent 64%),
    linear-gradient(155deg,rgba(215,235,255,.13) 0%,transparent 34%,transparent 74%,rgba(110,175,255,.06) 100%)!important;

/* 壁纸激活态下收敛动态聚光斑强度，避免白光斑冲淡底层风景照片 */

}
:root[data-has-wp="1"][data-glass="liquid"] .glass.is-spotting:not(.seg)::after{

}

/* 液态卡片轻触时的 3D 表面张力微倾 (松手平滑复原为 transform:none) */
:root[data-glass="liquid"] .glass{
  transition:transform .34s cubic-bezier(.20,.96,.32,1),box-shadow .28s ease,background-color .26s ease;
}
:root[data-glass="liquid"]:not(.fx-nopress) .glass.is-tilting{
  transform:perspective(920px) rotateX(var(--tilt-rx,0deg)) rotateY(var(--tilt-ry,0deg)) scale(.994);
  transition:transform .11s cubic-bezier(.20,.90,.32,1),box-shadow .22s ease;
}

/* 液态手风琴 (.fold): 展开舒展柔润(320ms)，收起轻快利落(225ms) */
:root[data-glass="liquid"] .fold{
  transition:grid-template-rows .225s cubic-bezier(.32,0,.24,1)!important;
}
:root[data-glass="liquid"] .open>.fold{
  transition:grid-template-rows .32s cubic-bezier(.20,.96,.32,1)!important;
}
:root[data-glass="liquid"] .fold-in{
  transform:translate3d(0,-7px,0) scale(.992);
  transition:opacity .15s ease,transform .22s cubic-bezier(.32,0,.24,1)!important;
}
:root[data-glass="liquid"] .open>.fold .fold-in{
  transform:none;
  transition:opacity .22s ease .03s,transform .32s cubic-bezier(.20,.96,.32,1) .02s!important;
}
:root[data-glass="liquid"] .chev{
  transition:transform .32s cubic-bezier(.22,1.24,.36,1);
}

/* 液态分段器 (.seg .thumb) */
:root[data-glass="liquid"] .seg .thumb,
:root[data-glass="liquid"] .seg.small .thumb{
  transition:transform .32s cubic-bezier(.22,1.16,.36,1),width .26s cubic-bezier(.20,.96,.32,1)!important;
}

/* 液态水滴开关 (.toggle): 纯 GPU transform 单段连续流变弹射，根治旧版 320ms 停顿二次跳变 */
@keyframes hncLiqTogOn{
  0%{transform:translate3d(0,0,0) scale(1,1)}
  38%{transform:translate3d(10.5px,0,0) scale(1.24,.89)}
  78%{transform:translate3d(23.2px,0,0) scale(.96,1.03)}
  100%{transform:translate3d(22px,0,0) scale(1,1)}
}
@keyframes hncLiqTogOff{
  0%{transform:translate3d(22px,0,0) scale(1,1)}
  38%{transform:translate3d(11.5px,0,0) scale(1.24,.89)}
  78%{transform:translate3d(-1.2px,0,0) scale(.96,1.03)}
  100%{transform:translate3d(0,0,0) scale(1,1)}
}
:root[data-glass="liquid"] .toggle::after{
  width:26px!important;
  transform-origin:center center;
  transition:transform .34s cubic-bezier(.22,1.26,.36,1),background .22s ease,box-shadow .22s ease!important;
}
:root[data-glass="liquid"] .toggle:not([aria-checked="true"]):active:not(.tog-on-fx):not(.tog-off-fx)::after{
  transform-origin:left center;
  transform:translate3d(0,0,0) scale(1.22,.93);
}
:root[data-glass="liquid"] .toggle[aria-checked="true"]:active:not(.tog-on-fx):not(.tog-off-fx)::after{
  transform-origin:right center;
  transform:translate3d(22px,0,0) scale(1.22,.93);
}
:root[data-glass="liquid"] .toggle.tog-on-fx::after{
  animation:hncLiqTogOn .34s cubic-bezier(.20,.96,.32,1) both;
}
:root[data-glass="liquid"] .toggle.tog-off-fx::after{
  animation:hncLiqTogOff .34s cubic-bezier(.20,.96,.32,1) both;
}
:root[data-glass="liquid"] .toggle.tog-on-fx::after,
:root[data-glass="liquid"] .toggle.tog-off-fx::after{
  box-shadow:
    inset 0 1.5px 1.5px #fff,
    inset 0 -1.5px 2px rgba(255,255,255,.78),
    0 5px 14px -2px rgba(15,40,80,.30),
    0 0 10px rgba(255,255,255,.55)!important;
}

/* 液态控制磁贴 (.cc-tile) 与按压反馈 */
@keyframes hncLiqOrbBloom{

  100%{transform:scale(1)}
}
:root[data-glass="liquid"] .cc-tile{
  transition:transform .30s cubic-bezier(.22,1.26,.36,1),background .24s ease,box-shadow .24s ease;
}
:root[data-glass="liquid"]:not(.fx-nopress) .cc-tile:active{
  transform:scale(.966);

}
:root[data-glass="liquid"] .cc-tile.pulse .cc-orb{
  animation:hncLiqOrbBloom .32s cubic-bezier(.22,1.28,.36,1);
}

/* ───────────────────────────────────────────────────────────────────────────
   7.3 模式二：经典毛玻璃 (:root[data-glass="frosted"])

}

}

}

}

}
:root[data-glass="frosted"] .toggle{

}
:root[data-glass="frosted"] .toggle::after{

:root[data-glass="frosted"] .toggle:not([aria-checked="true"]):active::after{

:root[data-glass="frosted"] .toggle[aria-checked="true"]::after{

}
:root[data-glass="frosted"] .toggle[aria-checked="true"]:active::after{

}

}

}

}

/* ───────────────────────────────────────────────────────────────────────────
   7.4 模式三：极简默认 (:root:not([data-style]):not([data-glass]))
       现代效率工具级微弹簧 · 160ms~200ms cubic-bezier(0.16, 1, 0.3, 1) · 零多余晃动
   ─────────────────────────────────────────────────────────────────────────── */
:root:not([data-style]):not([data-glass]) .press{

}

}
:root:not([data-style]):not([data-glass]) .fold{
  transition:grid-template-rows .155s cubic-bezier(.2,0,.2,1)!important;
}
:root:not([data-style]):not([data-glass]) .open>.fold{
  transition:grid-template-rows .185s cubic-bezier(.16,1,.3,1)!important;
}
:root:not([data-style]):not([data-glass]) .fold-in{

}

}

}
:root:not([data-style]):not([data-glass]) .seg .thumb,
:root:not([data-style]):not([data-glass]) .seg.small .thumb{

}
:root:not([data-style]):not([data-glass]) .seg button{

}
:root:not([data-style]):not([data-glass]) .toggle{

  border-radius:999px;
  transition:background-color .175s cubic-bezier(.16,1,.3,1);
}
:root:not([data-style]):not([data-glass]) .toggle::after{

}
:root:not([data-style]):not([data-glass]) .toggle[aria-checked="true"]::after{
  transform:translate3d(20px,0,0);
}
:root:not([data-style]):not([data-glass]) .toggle:not([aria-checked="true"]):active::after{

}
:root:not([data-style]):not([data-glass]) .toggle[aria-checked="true"]:active::after{

}
:root:not([data-style]):not([data-glass]) .cc-tile,
:root:not([data-style]):not([data-glass]) .cc-tile .cc-orb{

:root:not([data-style]):not([data-glass]):not(.fx-nopress) .cc-tile:active{

}
:root:not([data-style]):not([data-glass]) .cc-tile.pulse .cc-orb{

}

:root:not([data-style]):not([data-glass]) #tabs .tab svg{

}
:root:not([data-style]):not([data-glass]) .sheet{

}
:root:not([data-style]):not([data-glass]) .sheet.show{

}

/* ───────────────────────────────────────────────────────────────────────────
   7.5 模式四：赛博机能 (:root[data-style="cyber"])
       120ms~150ms 精准折线锁定 · 电光冰蓝扫描脉冲 · 战术拨杆与数字阶梯跳变 · 零果冻回弹
   ─────────────────────────────────────────────────────────────────────────── */
/* 全局切页电光冰蓝战术激光扫描线 (挂在 body 独立合成层，零布局与零 Backdrop 干扰) */
#hnc-cy-scan{
  position:fixed;
  left:0;
  right:0;
  top:0;
  height:36px;
  z-index:48;
  pointer-events:none;
  opacity:0;
  will-change:transform,opacity;
  background:linear-gradient(180deg,transparent 0%,rgba(98,165,220,.18) 78%,var(--cy-accent,#62A5DC) 96%,transparent 100%);
  background:linear-gradient(180deg,
    transparent 0%,
    color-mix(in srgb,var(--cy-accent,#62A5DC) 18%,transparent) 78%,
    var(--cy-accent,#62A5DC) 96%,
    transparent 100%);
  box-shadow:0 1px 12px rgba(98,165,220,.45);
  box-shadow:0 1px 12px color-mix(in srgb,var(--cy-accent,#62A5DC) 45%,transparent);
}

/* 战术机械按压: 干脆 1px 键程下扣，零果冻放大回弹 */
:root[data-style="cyber"] .press{
  transition:transform .12s cubic-bezier(.08,.94,.16,1),border-color .12s linear,background-color .12s linear,box-shadow .12s linear;
}
:root[data-style="cyber"]:not(.fx-nopress) .press:active{
  transform:translate3d(0,1px,0) scale(.992);
  transition:transform .045s linear;
}

/* 赛博卡片轻触定位微光脉冲 (.cy-card-ping) 与展开顶部战术扫描微脉冲 (.cy-fold-pulse) */
@keyframes hncCyPing{
  0%{opacity:.85}
  100%{opacity:0}
}
:root[data-style="cyber"] .glass.cy-card-ping::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:radial-gradient(130px circle at var(--spot-x,50%) var(--spot-y,50%),rgba(98,165,220,.26) 0%,transparent 72%);
  background:radial-gradient(130px circle at var(--spot-x,50%) var(--spot-y,50%),color-mix(in srgb,var(--cy-accent) 26%,transparent) 0%,transparent 72%);
  animation:hncCyPing .16s cubic-bezier(.08,.94,.16,1) forwards;
}
@keyframes hncCyFoldScan{
  0%{box-shadow:inset 0 2px 0 var(--cy-accent),0 0 18px -4px var(--cy-glow),var(--shadow-2)}
  100%{box-shadow:var(--shadow-2)}
}
:root[data-style="cyber"] .cy-fold-pulse{
  animation:hncCyFoldScan .17s cubic-bezier(.08,.94,.16,1);
}
@keyframes hncCyLockIn{
  0%{border-color:var(--cy-accent)}
  100%{border-color:var(--stroke)}
}
:root[data-style="cyber"] .cy-lock-in{
  animation:hncCyLockIn .15s linear;
}

/* 赛博手风琴 (.fold): 135ms 折线瞬展 / 115ms 机械收合 */
:root[data-style="cyber"] .fold{
  transition:grid-template-rows .115s cubic-bezier(.2,0,.1,1)!important;
}
:root[data-style="cyber"] .open>.fold{
  transition:grid-template-rows .135s cubic-bezier(.08,.94,.16,1)!important;
}
:root[data-style="cyber"] .fold-in{
  transform:translate3d(0,-3px,0);
  transition:opacity .09s linear,transform .115s cubic-bezier(.2,0,.1,1)!important;
}
:root[data-style="cyber"] .open>.fold .fold-in{
  transform:none;
  transition:opacity .11s linear,transform .135s cubic-bezier(.08,.94,.16,1)!important;
}
:root[data-style="cyber"] .chev{
  transition:transform .13s cubic-bezier(.08,.94,.16,1);
}

/* 赛博分段控制器 (.seg .thumb): 125ms 精准锁定 + 边框电光脉冲 */
:root[data-style="cyber"] .seg .thumb,
:root[data-style="cyber"] .seg.small .thumb{
  transition:transform .125s cubic-bezier(.08,.94,.16,1),width .125s cubic-bezier(.08,.94,.16,1),box-shadow .12s linear!important;
}
:root[data-style="cyber"] .seg.cy-seg-lock .thumb{
  box-shadow:0 0 0 1px var(--cy-accent),0 0 14px -2px var(--cy-glow);
}
:root[data-style="cyber"] .seg button{
  font-family:var(--mono);
  transition:color .10s linear;
}

/* 赛博专属战术拨杆开关 (.toggle): 方角导轨 + 蚀刻状态指示灯缝 + 125ms 机械卡扣 */
:root[data-style="cyber"] .toggle{
  width:48px;
  height:24px;
  border-radius:4px;
  background:var(--cy-sub);
  border:1px solid var(--stroke-2);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.28);
  transition:background-color .125s linear,border-color .125s linear,box-shadow .125s linear;
}
:root[data-style="cyber"] .toggle[aria-checked="true"]{
  background:var(--badge-ok-bg);
  background:color-mix(in srgb,var(--green) 22%,var(--card-solid));
  border-color:var(--green);
  box-shadow:inset 0 0 10px rgba(52,211,153,.24),0 0 10px -3px rgba(52,211,153,.36);
  box-shadow:inset 0 0 10px color-mix(in srgb,var(--green) 24%,transparent),0 0 10px -3px color-mix(in srgb,var(--green) 36%,transparent);
}
:root[data-style="cyber"] .toggle::after{
  top:2px;
  left:2px;
  width:20px!important;
  height:18px;
  border-radius:2.5px;
  background:
    linear-gradient(90deg,transparent 43%,var(--text-4) 43%,var(--text-4) 57%,transparent 57%),
    linear-gradient(180deg,var(--card-2),var(--card-solid));
  border:1px solid var(--stroke-2);
  box-shadow:0 1px 3px rgba(0,0,0,.36);
  transition:transform .125s cubic-bezier(.08,.94,.16,1),border-color .12s linear,background .12s linear!important;
}
:root[data-style="cyber"] .toggle[aria-checked="true"]::after{
  transform:translate3d(22px,0,0);
  border-color:var(--green);
  background:
    linear-gradient(90deg,transparent 43%,var(--green) 43%,var(--green) 57%,transparent 57%),
    linear-gradient(180deg,var(--card-2),var(--card-solid));
}
:root[data-style="cyber"] .toggle:not([aria-checked="true"]):active::after{
  transform:translate3d(1px,0,0);
}
:root[data-style="cyber"] .toggle[aria-checked="true"]:active::after{
  transform:translate3d(21px,0,0);
}

/* 赛博控制磁贴 (.cc-tile): 机械锁定角标与冰蓝脉冲，彻底禁用果冻放大 */
@keyframes hncCyTileLock{
  0%{box-shadow:inset 0 0 0 1.5px var(--cy-accent),0 0 16px -3px var(--cy-glow)}

}

/* ───────────────────────────────────────────────────────────────────────────

   ─────────────────────────────────────────────────────────────────────────── */
:root.lowfx .glass.is-tilting,
:root.calm .glass.is-tilting{
  transform:none!important;
}
:root.calm #hnc-cy-scan,
:root.lowfx #hnc-cy-scan{
  display:none!important;
}

:root.calm .toggle.tog-off-fx::after,
:root.calm .cc-tile.pulse,
:root.calm .cc-tile.pulse .cc-orb,
:root.calm .cy-fold-pulse,

  animation:none!important;
}

  transition-delay:0s!important;
  animation-delay:0s!important;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    transition-delay:0s!important;
    animation-delay:0s!important;
  }
  #hnc-cy-scan{display:none!important}
  .glass.is-tilting{transform:none!important}

  .toggle.tog-off-fx::after,
  .cc-tile.pulse,
  .cc-tile.pulse .cc-orb,
  .cy-fold-pulse,
  .cy-lock-in,
  .glass.cy-card-ping::after{
    animation:none!important;

/* ═══════════════════════════════════════════════════════════════════════════
   PART 10 · HNC v6.0.0 Master Frontend Architecture (A2UI Surface Token System)
   · 谷歌 A2UI 1.0 & Chrome Modern Web Guidance 语义表面令牌解耦（终结特异性混战）
   · 纯正 iOS 26 / macOS Dark Mode 黑曜石四级空间明度体系（L0 #08090C → L1 #16181F → L2 → L3）
   · Adreno TBDR 满帧 120fps 光学折射引擎 v2（零 SaveLayer 异或遮罩、零三明治回读、滚动硬件 Mipmap 快径）
   · 经典毛玻璃（Satin Vibrancy）、极简精密（Linear/Vercel）、赛博机甲（Endfield HUD）全模式深度精雕
   ═══════════════════════════════════════════════════════════════════════════ */

/* 10.0 全局语义表面令牌与未定义变量统一收口 */
:root {
  --accent: var(--blue);
  --text: var(--text-1);
  --t2: var(--text-3);
  --t3: var(--text-3);
  --border: var(--stroke);
}

/* 窄屏与宿主内嵌预览顶栏防拥挤排布：区分 3 列玻璃 Hero 与 5 列分割线 Hero */
@media (max-width: 460px) {
  .header #sig-pill:not([hidden]) + #mode-pill { display: none !important; }
  [data-glass] .hero:not(.v6-hero) { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1.12fr) minmax(74px, .82fr) !important; gap: 8px !important; }
  :root:not([data-glass]) .hero:not(.v6-hero) { grid-template-columns: minmax(0, 1.12fr) 1px minmax(0, 1.12fr) 1px minmax(72px, .82fr) !important; }
  [data-glass] .hero:not(.v6-hero) > div:not(.hero-div):not(.hero-spark-hud) { padding: 10px 10px !important; }
  .hero .hero-v { font-size: 23px !important; }
}

/* ───────────────────────────────────────────────────────────────────────────
   10.1 120fps 光学折射合成管线 v2（Adreno 830 TBDR 零 SaveLayer 阻塞架构）
   ─────────────────────────────────────────────────────────────────────────── */
/* 1) 移除底部 body::after 双重离屏模糊与遮罩，改为纯 Alpha 渐隐衬底（消灭底部三明治回读） */
body::after {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  -webkit-mask-image: none !important;
  mask-image: none !important;
  background: linear-gradient(to top, var(--bg) 0%, transparent 100%) !important;
}
@supports (background: color-mix(in srgb, #000 50%, transparent)) {
  body::after {
    background: linear-gradient(to top, var(--bg) 0%, color-mix(in srgb, var(--bg) 56%, transparent) 52%, transparent 100%) !important;
  }
}
/* 2) 顶栏模糊核恒定化：仅通过合成器线程改变 opacity: var(--hs, 0)，彻底杜绝动态模糊半径每帧重建 Shader */
[data-glass="liquid"] .header::before,
[data-glass="frosted"] .header::before {
  opacity: calc(var(--hp, 0) * (1 - var(--hs, 0))) !important;
  -webkit-backdrop-filter: blur(16px) saturate(185%) !important;
  backdrop-filter: blur(16px) saturate(185%) !important;
}
[data-glass="liquid"] .header.hs-on::after,
[data-glass="frosted"] .header.hs-on::after {
  -webkit-backdrop-filter: blur(16px) saturate(185%) !important;
  backdrop-filter: blur(16px) saturate(185%) !important;
  opacity: var(--hs, 0) !important;
  will-change: opacity;
}
/* 3) 顶栏 37px 圆钮走硬件 Mipmap + 非对称色散棱镜内阴影（省去 3 路全分辨率 SVG ReferenceFilter） */
:root[data-glass="liquid"]:not([data-theme="dark"]):not([data-has-wp="1"]) .hbtn {
  -webkit-backdrop-filter: blur(12px) saturate(195%) !important;
  backdrop-filter: blur(12px) saturate(195%) !important;
  box-shadow:
    inset 1px 1px .6px rgba(255, 255, 255, .92),
    inset -1px -1px .8px rgba(56, 189, 248, .28),
    inset .8px -.8px .8px rgba(244, 114, 182, .18),
    0 6px 16px -6px rgba(15, 30, 65, .16) !important;
}
/* 4) 底栏 #tabbar：静止与拖拽透镜时运行精简版 Snell 光学折射；页面高速滚屏期无缝切入硬件 Mipmap 快径稳跑 120fps */
:root[data-glass="liquid"] #tabbar {
  -webkit-backdrop-filter: var(--hyalite, blur(20px)) saturate(185%) !important;
  backdrop-filter: var(--hyalite, blur(20px)) saturate(185%) !important;
}
:root.is-scrolling[data-glass="liquid"] #tabbar:not(.drag):not(.pressing),
:root.is-scrolling[data-glass="liquid"] #tabbar.tabbar:not(.drag):not(.pressing) {
  -webkit-backdrop-filter: blur(20px) saturate(190%) !important;
  backdrop-filter: blur(20px) saturate(190%) !important;
}
/* 5) 滚动列表卡片保留 layout style 遏制；仅对分段器与弹层内子卡隐藏 ::before */
:root[data-glass="liquid"] .dev:not(.open),
:root[data-glass="liquid"] .scard:not(.open) {
  contain: layout style !important;
}
:root[data-glass="liquid"] .seg.glass::before,
:root[data-glass="liquid"] .sheet .glass::before,
:root[data-glass="liquid"] .v6-drawer.glass::before {
  display: none !important;
  content: none !important;
}
:root[data-glass="liquid"]:not([data-theme="dark"]):not([data-has-wp="1"]) .glass:not(#tabbar):not(.seg) {
  isolation: auto;
  -webkit-backdrop-filter: blur(16px) saturate(190%) !important;
  backdrop-filter: blur(16px) saturate(190%) !important;
  box-shadow:
    inset 1.1px 1.1px .5px rgba(255, 255, 255, .92),
