<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#08090C" media="(prefers-color-scheme: dark)" />
<title>HNC JSON 健康面板</title>
<style>
:root {
  --bg: #eef3fb;
  --orb-1: rgba(56, 189, 248, 0.26);
  --orb-2: rgba(99, 102, 241, 0.18);
  --card: rgba(255, 255, 255, 0.68);
  --mini-bg: rgba(15, 23, 42, 0.035);
  --line: rgba(15, 23, 42, 0.08);
  --card-bd: rgba(255, 255, 255, 0.84);
  --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 16px 38px -16px rgba(15, 23, 42, 0.12);
  --blur: 22px;
  --sat: 175%;
  --text: #0f172a;
  --muted: #64748b;
  --mono-fg: #1e293b;
  --ok: #16a34a;
  --ok-bg: rgba(22, 163, 74, 0.13);
  --warn: #d97706;
  --warn-bg: rgba(217, 119, 6, 0.14);
  --bad: #dc2626;
  --bad-bg: rgba(220, 38, 38, 0.13);
  --unk-bg: rgba(100, 116, 139, 0.13);
  --blue: #007aff;
  --blue2: #5856d6;
  --btn-sec-bg: rgba(15, 23, 42, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08090C;
    --orb-1: rgba(78, 161, 255, 0.22);
    --orb-2: rgba(124, 92, 255, 0.16);
    --card: rgba(19, 28, 44, 0.72);
    --mini-bg: rgba(255, 255, 255, 0.045);
    --line: rgba(255, 255, 255, 0.08);
    --card-bd: rgba(255, 255, 255, 0.12);
    --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 18px 42px -16px rgba(0, 0, 0, 0.48);
    --text: #eef6ff;
    --muted: #91a4bd;
    --mono-fg: #cfe1ff;
    --ok: #35d07f;
    --ok-bg: rgba(53, 208, 127, 0.16);
    --warn: #ffd166;
    --warn-bg: rgba(255, 209, 102, 0.16);
    --bad: #ff5c7a;
    --bad-bg: rgba(255, 92, 122, 0.16);
    --unk-bg: rgba(145, 164, 189, 0.15);
    --blue: #4ea1ff;
    --blue2: #7c5cff;
    --btn-sec-bg: rgba(255, 255, 255, 0.08);
  }
}
:root[data-theme="dark"] {
  --bg: #08090C;
  --orb-1: rgba(78, 161, 255, 0.22);
  --orb-2: rgba(124, 92, 255, 0.16);
  --card: rgba(19, 28, 44, 0.72);
  --mini-bg: rgba(255, 255, 255, 0.045);
  --line: rgba(255, 255, 255, 0.08);
  --card-bd: rgba(255, 255, 255, 0.12);
  --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 18px 42px -16px rgba(0, 0, 0, 0.48);
  --text: #eef6ff;
  --muted: #91a4bd;
  --mono-fg: #cfe1ff;
  --ok: #35d07f;
  --ok-bg: rgba(53, 208, 127, 0.16);
  --warn: #ffd166;
  --warn-bg: rgba(255, 209, 102, 0.16);
  --bad: #ff5c7a;
  --bad-bg: rgba(255, 92, 122, 0.16);
  --unk-bg: rgba(145, 164, 189, 0.15);
  --blue: #4ea1ff;
  --blue2: #7c5cff;
  --btn-sec-bg: rgba(255, 255, 255, 0.08);
}
:root[data-style="cyber"] { --blue: #4ea8de; --blue2: #64748b; --sat: 135%; }
:root[data-glass="frosted"] { --blur: 28px; --sat: 145%; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(circle at 14% 0%, var(--orb-1), transparent 40%), radial-gradient(circle at 96% 18%, var(--orb-2), transparent 42%), var(--bg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  color: var(--text);
  padding: 18px 16px 28px;
  padding: max(18px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.title { font-size: 21px; font-weight: 800; letter-spacing: -0.2px; line-height: 1.25; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; line-height: 1.45; }
.back-pill {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap;
  padding: 8px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--card-bd);
  color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 700; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
}
.card {
  background: var(--card); border: 1px solid var(--card-bd); border-radius: 22px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  padding: 16px; margin: 12px 0;
}
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .card, .back-pill { background: rgba(255, 255, 255, 0.96); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card,
    :root:not([data-theme="light"]) .back-pill { background: rgba(19, 28, 44, 0.96); }
  }
  :root[data-theme="dark"] .card,
  :root[data-theme="dark"] .back-pill { background: rgba(19, 28, 44, 0.96); }
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row-label { min-width: 0; flex: 1 1 auto; }
.name { font-weight: 650; font-size: 14px; }
.val { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; text-align: right; min-width: 0; max-width: 58%; word-break: break-word; overflow-wrap: break-word; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap; border-radius: 999px; padding: 5px 10px; font-weight: 750; font-size: 12px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ok { background: var(--ok-bg); color: var(--ok); }
.warn { background: var(--warn-bg); color: var(--warn); }
.bad { background: var(--bad-bg); color: var(--bad); }
.unknown { background: var(--unk-bg); color: var(--muted); }
button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; height: 39px; border-radius: 12px;
  padding: 0 14px; font-size: 13.5px; color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue2));
  font-weight: 750; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(0, 122, 255, 0.32); transition: opacity 0.18s, transform 0.12s;
}
button.sec { color: var(--text); background: var(--btn-sec-bg); border: 1px solid var(--line); box-shadow: none; }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.48; cursor: not-allowed; transform: none; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.mono { white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mono-fg); font-size: 12px; line-height: 1.55; max-height: 220px; overflow-y: auto; margin-top: 8px; }
.mono:empty::before { content: "等待操作记录…"; color: var(--muted); }
.hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 10px 0 0; }
.small { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.sectionTitle { font-size: 14.5px; font-weight: 800; margin: 15px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mini { background: var(--mini-bg); border: 1px solid var(--line); border-radius: 15px; padding: 11px 12px; }
.mini .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.mini .v { font-weight: 750; word-break: break-word; overflow-wrap: break-word; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .row.stack-sm { flex-direction: column; align-items: flex-start; gap: 4px; }
  .row.stack-sm .val { max-width: 100%; text-align: left; }
}
@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
  .btns button { flex: 1 1 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">JSON 健康面板</div>
      <div class="sub"><span id="jh-ver-label" data-ui-ver="v6.1.0-rc.2">HNC v6.1.0-rc.2</span> · 配置完整性只读巡检与诊断包导出</div>
    </div>
    <a class="back-pill" href="./">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>返回控制台</span>
    </a>
  </div>

  <div class="card">
    <div class="btns">
      <button id="refreshBtn" type="button">刷新健康状态</button>
      <button id="exportBtn" class="sec" type="button">导出 JSON 诊断包</button>
    </div>
    <p class="hint" id="modeHint">本页全程只读，不会修改 <b>rules.json</b>。本机模式打包至 <b>/sdcard/Download/hnc-json-debug-*.tar.gz</b>，浏览器模式直接生成并下载归档包。</p>
  </div>

  <div class="card" id="summaryCard"><div class="hint" style="margin:0">正在读取诊断状态…</div></div>
  <div class="card"><div class="name">执行日志</div><div id="log" class="mono"></div></div>
</div>
<script>
(function(){
  try {
    var r = document.documentElement;
    var t = localStorage.getItem('hnc6.theme');
    var s = localStorage.getItem('hnc6.style');
    var gm = localStorage.getItem('hnc6.glass_mode') === 'frosted' ? 'frosted' : 'liquid';
    if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
    if (s === 'liquid') { r.setAttribute('data-style', 'apple'); r.setAttribute('data-glass', gm); }
    else if (s === 'cyber' || s === 'apple') r.setAttribute('data-style', 'cyber');
  } catch (_) {}

  var HNC = '/data/local/hnc';
  var hasKSU = !!(window.ksu && typeof window.ksu.exec === 'function');
  var cbSeq = 0;

  function log(msg) {
    var el = document.getElementById('log');
    el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + (el.textContent ? '\n' + el.textContent : '');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function badge(v) {
    var s = String(v || 'unknown').toLowerCase();
    var cls = s === 'ok' ? 'ok' : (s === 'bad' || s === 'fail' || s === 'error' ? 'bad' : (s === 'warn' || s === 'missing' ? 'warn' : 'unknown'));
    var label = { ok: '正常 (ok)', warn: '告警 (warn)', missing: '缺失 (missing)', bad: '损坏 (bad)', fail: '异常 (fail)', unknown: '未知' }[s] || String(v || 'unknown');
    return '<span class="pill ' + cls + '">' + esc(label) + '</span>';
  }
  function parseRaw(raw) {
    if (!raw) return null;
    if (typeof raw === 'object') return raw;
    try { return JSON.parse(String(raw)); } catch (e) { return null; }
  }
  function ksuExec(cmd, timeoutMs) {
    return new Promise(function(resolve, reject) {
      if (!hasKSU) { reject(new Error('当前非本机 Root WebView 环境')); return; }
      if (window.ksu.exec.length <= 1) {
        Promise.resolve(window.ksu.exec(cmd)).then(function(r) {
          if (typeof r === 'string') resolve(r);
          else if (r && typeof r.stdout === 'string') resolve(r.stdout + (r.stderr ? '\n' + r.stderr : ''));
          else resolve(JSON.stringify(r || ''));
        }, reject);
        return;
      }
      var name = '__hnc_jh_cb_' + (++cbSeq) + '_' + Date.now();
      var timer = setTimeout(function() { delete window[name]; reject(new Error('命令执行超时')); }, timeoutMs || 15000);
      window[name] = function(code, stdout, stderr) {
        clearTimeout(timer);
        delete window[name];
        if (code !== 0 && !stdout) reject(new Error(stderr || ('exit ' + code)));
        else resolve(String(stdout || stderr || ''));
      };
      try { window.ksu.exec(cmd, name); } catch (e) { clearTimeout(timer); delete window[name]; reject(e); }
    });
  }
  function extractJSON(out) {
    var trimmed = String(out || '').trim();
    var jsonStart = trimmed.search(/\{\s*"/);
    if (jsonStart >= 0) trimmed = trimmed.substring(jsonStart);
    return JSON.parse(trimmed);
  }

  async function refreshHealth() {
    var btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    try {
      if (window.__HNC_MOCK_JSON_HEALTH__) {
        render(window.__HNC_MOCK_JSON_HEALTH__);
        log('已加载演示健康诊断摘要');
        return;
      }
      if (hasKSU) {
        var out = await ksuExec('sh ' + HNC + '/bin/json_health_panel.sh status');
        render(extractJSON(out));
        log('已通过本机 WebView 桥刷新 JSON 健康状态');
        return;
      }
      var r = await fetch('/api/json_health', { credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { location.href = '/pair'; return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
      log('已通过 HTTP /api/json_health 刷新健康状态');
    } catch (e) {
      document.getElementById('summaryCard').innerHTML = '<div class="pill bad">读取失败</div><p class="hint">' + esc(e.message || e) + '</p>';
      log('刷新失败: ' + (e.message || e));
    } finally {
      btn.disabled = false;
    }
  }

  function setVerLabel(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s || /^(dev|unknown|none|-|null|undefined)$/i.test(s)) return;
    var el = document.getElementById('jh-ver-label');
    if (el) el.textContent = 'HNC ' + s;
  }
  function render(data) {
    if (data && data.backend_version) setVerLabel(data.backend_version);
    var files = data.files || {};
    var tc = data.tc_state || {};
    var html = '';
    html += '<div class="row"><div class="row-label"><div class="name">整体状态</div><div class="small">json_doctor rc=' + esc(data.json_doctor_rc) + '</div></div><div>' + badge(data.overall) + '</div></div>';
    var keys = ['rules.json', 'device_names.json', 'templates.json', 'remote_tokens.json', 'devices.json'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      html += '<div class="row"><div class="row-label"><div class="name">' + esc(k) + '</div></div><div>' + badge(files[k]) + '</div></div>';
    }
    html += '<div class="row"><div class="row-label"><div class="name">JSON 滚动备份数</div></div><div class="val">' + esc(data.backup_count) + '</div></div>';
    html += '<div class="row stack-sm"><div class="row-label"><div class="name">最新备份文件</div></div><div class="val">' + esc(data.latest_backup || '无') + '</div></div>';
    html += '<div class="row"><div class="row-label"><div class="name">TC 状态快照</div>' + (tc.note ? '<div class="small">' + esc(tc.note) + '</div>' : '') + '</div><div>' + badge(data.has_tc_state ? 'ok' : 'missing') + '</div></div>';
    html += '<div class="row"><div class="row-label"><div class="name">能力探测文件</div></div><div>' + badge(data.has_capabilities ? 'ok' : 'missing') + '</div></div>';
    html += '<div class="row stack-sm"><div class="row-label"><div class="name">最近导出诊断包</div></div><div class="val">' + esc(data.last_bundle || '无') + '</div></div>';

    var stats = data.stats || {};
    var sh = parseRaw(stats.health_summary_raw) || {};
    var comp = sh.components || {};
    html += '<div class="sectionTitle">流量统计诊断</div>';
    html += '<div class="grid">';
    html += '<div class="mini"><div class="k">统计健康总评</div><div class="v">' + badge(sh.status || 'missing') + '</div></div>';
    var pairs = [['采样文件', 'stats_diag'], ['设备身份', 'stats_identity'], ['保留 / 汇总', 'stats_retention']];
    for (var j = 0; j < pairs.length; j++) {
      html += '<div class="mini"><div class="k">' + esc(pairs[j][0]) + '</div><div class="v">' + badge(comp[pairs[j][1]] || 'missing') + '</div></div>';
    }
    html += '</div>';
    if (sh.recommendation) html += '<p class="hint"><b>排障建议：</b>' + esc(sh.recommendation) + '</p>';
    if (data.json_doctor_message) html += '<p class="hint">' + esc(data.json_doctor_message) + '</p>';
    document.getElementById('summaryCard').innerHTML = html;
  }

  async function exportBundle() {
    var btn = document.getElementById('exportBtn');
    btn.disabled = true;
    try {
      log('开始导出 JSON 诊断包…');
      if (hasKSU) {
        var out = await ksuExec('sh ' + HNC + '/bin/json_health_panel.sh export', 30000);
        var data = extractJSON(out);
        if (data && data.overall && !data.path && !data.bundle && data.rc === undefined) {
          out = await ksuExec('sh ' + HNC + '/bin/json_export_for_web.sh', 30000);
          data = extractJSON(out);
        }
        var expPath = (data && (data.path || data.bundle || data.last_bundle)) || '';
        if (data && data.ok) log('导出完成' + (expPath ? ': ' + expPath : ''));
        else log('导出失败 rc=' + (data && data.rc != null ? data.rc : '?') + ' ' + ((data && (data.output || data.error)) || ''));
        await refreshHealth();
        return;
      }
      var nowSec = Math.floor(Date.now() / 1000);
      var r = await fetch('/api/export', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-HNC-CSRF': '1' },
        body: JSON.stringify({ from: nowSec - 86400, to: nowSec, notes: ['json-health-panel'] })
      });
      if (r.status === 401) { location.href = '/pair'; return; }
      var res = {};
      try { res = await r.json(); } catch (_) {}
      if (!r.ok || !res || !res.name) {
        throw new Error((res && res.error) ? res.error : ('HTTP ' + r.status));
      }
      var dlUrl = res.download_url || ('/api/exports/' + encodeURIComponent(res.name));
      var a = document.createElement('a');
      a.href = dlUrl;
      a.download = res.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      log('诊断归档已生成并触发浏览器下载: ' + res.name);
      await refreshHealth();
    } catch (e) {
      log('导出失败: ' + (e.message || e));
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', function(){ refreshHealth(); });
  document.getElementById('exportBtn').addEventListener('click', function(){ exportBundle(); });
  (function syncJhVer(){
    try {
      if (window.ksu && typeof window.ksu.moduleInfo === 'function') {
        var info = JSON.parse(window.ksu.moduleInfo() || '{}');
        if (info && info.version) { setVerLabel(info.version); return; }
      }
    } catch (_) {}
    if (!hasKSU && /^https?:$/i.test(location.protocol)) {
      fetch('/api/live', { credentials: 'same-origin', cache: 'no-store' })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if (d && d.backend_version) setVerLabel(d.backend_version); })
        .catch(function(){});
    }
  })();
  refreshHealth();
})();
</script>
</body>
</html>
