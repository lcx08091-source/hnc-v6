<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b111d" media="(prefers-color-scheme: dark)">
<title>HNC 远程访问配对 · Remote Pairing</title>
<style>
:root {
  --bg: #eef3fb;
  --orb-1: rgba(56, 189, 248, 0.30);
  --orb-2: rgba(99, 102, 241, 0.22);
  --orb-3: rgba(45, 212, 191, 0.20);
  --card: rgba(255, 255, 255, 0.68);
  --card-border: rgba(255, 255, 255, 0.82);
  --card-rim: inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 20px 48px -18px rgba(15, 23, 42, 0.14);
  --blur: 24px;
  --sat: 180%;
  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #64748b;
  --input-bg: rgba(15, 23, 42, 0.045);
  --input-border: rgba(15, 23, 42, 0.12);
  --accent: #007aff;
  --accent-2: #5856d6;
  --accent-ring: rgba(0, 122, 255, 0.20);
  --btn-fg: #ffffff;
  --err-bg: rgba(239, 68, 68, 0.10);
  --err-bd: rgba(239, 68, 68, 0.26);
  --err-fg: #dc2626;
  --ok-bg: rgba(0, 122, 255, 0.09);
  --ok-bd: rgba(0, 122, 255, 0.24);
  --ok-fg: #0369a1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090f1a;
    --orb-1: rgba(56, 189, 248, 0.20);
    --orb-2: rgba(129, 140, 248, 0.18);
    --orb-3: rgba(45, 212, 191, 0.12);
    --card: rgba(22, 30, 46, 0.72);
    --card-border: rgba(255, 255, 255, 0.12);
    --card-rim: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 24px 56px -16px rgba(0, 0, 0, 0.55);
    --text-1: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --input-bg: rgba(0, 0, 0, 0.32);
    --input-border: rgba(255, 255, 255, 0.14);
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --accent-ring: rgba(56, 189, 248, 0.22);
    --btn-fg: #08111f;
    --err-bg: rgba(239, 68, 68, 0.14);
    --err-bd: rgba(248, 113, 113, 0.32);
    --err-fg: #fca5a5;
    --ok-bg: rgba(56, 189, 248, 0.13);
    --ok-bd: rgba(56, 189, 248, 0.30);
    --ok-fg: #7dd3fc;
  }
}
:root[data-theme="dark"] {
  --bg: #090f1a;
  --orb-1: rgba(56, 189, 248, 0.20);
  --orb-2: rgba(129, 140, 248, 0.18);
  --orb-3: rgba(45, 212, 191, 0.12);
  --card: rgba(22, 30, 46, 0.72);
  --card-border: rgba(255, 255, 255, 0.12);
  --card-rim: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 24px 56px -16px rgba(0, 0, 0, 0.55);
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --input-bg: rgba(0, 0, 0, 0.32);
  --input-border: rgba(255, 255, 255, 0.14);
  --accent: #38bdf8;
  --accent-2: #818cf8;
  --accent-ring: rgba(56, 189, 248, 0.22);
  --btn-fg: #08111f;
  --err-bg: rgba(239, 68, 68, 0.14);
  --err-bd: rgba(248, 113, 113, 0.32);
  --err-fg: #fca5a5;
  --ok-bg: rgba(56, 189, 248, 0.13);
  --ok-bd: rgba(56, 189, 248, 0.30);
  --ok-fg: #7dd3fc;
}
:root[data-style="cyber"] { --accent: #4ea8de; --accent-2: #64748b; --blur: 18px; --sat: 135%; }
:root[data-glass="frosted"] { --blur: 30px; --sat: 145%; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(48% 42% at 14% 12%, var(--orb-1) 0%, transparent 72%),
    radial-gradient(46% 40% at 88% 18%, var(--orb-2) 0%, transparent 72%),
    radial-gradient(48% 44% at 22% 88%, var(--orb-3) 0%, transparent 74%),
    var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-1);
  padding:
    max(20px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}
@media (max-height: 560px) {
  body { align-items: flex-start; padding-top: max(14px, env(safe-area-inset-top)); }
}
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 26px;
  padding: 30px 24px 26px;
  max-width: 410px;
  width: 100%;
  box-shadow: var(--card-rim);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
}
.brand-head { display: flex; align-items: center; gap: 13px; margin-bottom: 12px; }
.orb-icon {
  width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.20), rgba(99, 102, 241, 0.18));
  border: 1px solid var(--card-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
  color: var(--accent);
}
h1 { font-size: 20px; font-weight: 750; letter-spacing: -0.2px; color: var(--text-1); line-height: 1.25; }
.badge-sub { font-size: 11px; font-weight: 600; color: var(--text-3); margin-top: 2px; letter-spacing: 0.2px; }
.sub { font-size: 13px; color: var(--text-2); margin-bottom: 22px; line-height: 1.6; }
.sub strong { color: var(--text-1); font-weight: 650; }
label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
label span.ttl { font-weight: 500; color: var(--text-3); }
input[type="text"] {
  width: 100%; padding: 14px 12px; font-size: clamp(22px, 6.5vw, 26px);
  text-align: center; letter-spacing: 0.42em; text-indent: 0.42em;
  background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 15px;
  color: var(--text-1); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
}
input[type="text"]::placeholder { color: var(--text-3); opacity: 0.55; }
input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-ring); }
button {
  width: 100%; margin-top: 16px; padding: 13px 16px; font-size: 15px; font-weight: 700;
  color: var(--btn-fg); background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none; border-radius: 15px; cursor: pointer;
  box-shadow: 0 10px 24px -8px var(--accent-ring);
  transition: opacity 0.18s, transform 0.12s;
}
button:hover { opacity: 0.93; }
button:active { transform: scale(0.985); }
button:disabled { opacity: 0.52; cursor: not-allowed; transform: none; }
.msg {
  margin-top: 14px; padding: 11px 13px; border-radius: 13px;
  font-size: 13px; line-height: 1.5; display: none; align-items: flex-start; gap: 8px;
}
.msg.show { display: flex; }
.msg svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.msg.error { background: var(--err-bg); border: 1px solid var(--err-bd); color: var(--err-fg); }
.msg.info { background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--ok-fg); }
.footer { margin-top: 20px; font-size: 11.5px; color: var(--text-3); text-align: center; line-height: 1.55; }
@media (max-width: 360px) {
  .card { padding: 22px 18px 20px; border-radius: 22px; }
  input[type="text"] { letter-spacing: 0.30em; text-indent: 0.30em; }
}
</style>
</head>
<body>
<div class="card">
  <div class="brand-head">
    <span class="orb-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="3" fill="currentColor" fill-opacity="0.14"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        <circle cx="12" cy="16" r="1.4" fill="currentColor"/>
      </svg>
    </span>
    <div>
      <h1>HNC 远程访问配对</h1>
      <div class="badge-sub">Hotspot Network Control · TLS Session Auth</div>
    </div>
  </div>

  <p class="sub">
    请在手机本机管理界面点击 <strong>「生成配对码」</strong>，随后在下方输入屏幕显示的 6 位数字配对码。
  </p>

  <form id="pair-form">
    <label for="pin">
      <span>6 位数字配对码</span>
      <span class="ttl">120 秒内有效</span>
    </label>
    <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus>
    <button type="submit" id="submit-btn">验证并登入</button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <p class="footer">
    首次配对验证通过后将自动签发安全会话并跳转至控制台；若配对码过期，请返回手机本机重新生成。
  </p>
</div>

<script>
(function(){
  try {
    var r = document.documentElement;
    var t = localStorage.getItem('hnc6.theme');
    var s = localStorage.getItem('hnc6.style');
    var gm = localStorage.getItem('hnc6.glass_mode') === 'frosted' ? 'frosted' : 'liquid';
    if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
    if (s === 'liquid') { r.setAttribute('data-style', 'apple'); r.setAttribute('data-glass', gm); }
    else if (s === 'cyber' || s === 'apple') r.setAttribute('data-style', 'cyber');
  } catch (_) {}

  var form = document.getElementById('pair-form');
  var pinInput = document.getElementById('pin');
  var btn = document.getElementById('submit-btn');
  var msg = document.getElementById('msg');

  var ICONS = {
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5"/><circle cx="12" cy="16" r="0.6" fill="currentColor"/></svg>'
  };

  pinInput.addEventListener('input', function(e){
    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
  });

  function showMsg(kind, text, boldPart, tailText) {
    msg.className = 'msg show ' + kind;
    msg.innerHTML = ICONS[kind === 'info' ? 'info' : 'error'] + '<span class="msg-tx"></span>';
    var tx = msg.querySelector('.msg-tx');
    if (boldPart) {
      tx.appendChild(document.createTextNode(text));
      var b = document.createElement('strong');
      b.textContent = boldPart;
      tx.appendChild(b);
      if (tailText) tx.appendChild(document.createTextNode(tailText));
    } else {
      tx.textContent = text;
    }
  }

  function getPrefillPin(){
    try {
      var m = window.location.search.match(/[?&]prefill=([0-9]{6})(?:&|$)/);
      return m ? m[1] : null;
    } catch(e){ return null; }
  }
  var prefillPin = getPrefillPin();
  if (prefillPin) {
    pinInput.value = prefillPin;
    try {
      var cleanUrl = window.location.pathname + window.location.hash;
      history.replaceState(null, '', cleanUrl);
    } catch(e){}
    showMsg('info', '已识别快捷配对链接，正在自动验证登入…');
    setTimeout(function(){
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
    }, 450);
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var pin = pinInput.value.trim();
    if (pin.length !== 6) {
      showMsg('error', '请输入完整的 6 位数字配对码');
      return;
    }

    btn.disabled = true;
    btn.textContent = '正在验证…';
    msg.className = 'msg';
    var pairedOk = false;

    try {
      var body = new URLSearchParams();
      body.append('pin', pin);
      var resp = await fetch('/api/pair/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: body.toString(),
        redirect: 'manual'
      });

      if (resp.type === 'opaqueredirect' || (resp.status >= 300 && resp.status < 400)) {
        pairedOk = true;
        btn.textContent = '验证通过，正在进入…';
        showMsg('info', '配对验证通过，正在进入管理控制台…');
        setTimeout(function(){ window.location.href = '/'; }, 380);
        return;
      }

      var data = {};
      try { data = await resp.json(); } catch(_) {}
      var errMsg = data.error || ('请求异常 (HTTP ' + resp.status + ')');

      if (resp.status === 429) {
        var sec = data.locked_for_sec || parseInt(resp.headers.get('Retry-After'), 10) || 600;
        var mins = Math.ceil(sec / 60);
        showMsg('error', '验证尝试过于频繁，请等待约 ' + mins + ' 分钟后重试');
      } else if (errMsg.indexOf('invalidated') >= 0) {
        showMsg('error', '该配对码累计输错次数超限已自动作废，请回手机本机重新生成');
      } else if (resp.status === 410 || errMsg.indexOf('expired') >= 0) {
        showMsg('error', '配对码已超过 120 秒有效期，请回手机本机重新生成');
      } else if (errMsg.indexOf('no active') >= 0) {
        showMsg('error', '当前无活动配对会话，请先在手机本机点击「生成配对码」');
      } else if (errMsg.indexOf('wrong pin') >= 0) {
        var rem = data.attempts_remaining;
        if (typeof rem === 'number' && rem >= 0) {
          if (rem === 0) {
            showMsg('error', '配对码不匹配，已达当前窗口尝试上限');
          } else if (rem === 1) {
            showMsg('error', '配对码错误，仅剩 ', '最后 1 次机会', '，再次错误将临时锁定 10 分钟');
          } else {
            showMsg('error', '配对码错误，当前还剩 ' + rem + ' 次尝试机会');
          }
        } else {
          showMsg('error', '配对码错误，请核对本机屏幕上的 6 位数字后重试');
        }
      } else if (errMsg.indexOf('bad pin format') >= 0) {
        showMsg('error', '配对码格式无效，请输入 6 位纯数字');
      } else {
        showMsg('error', errMsg);
      }
    } catch(err) {
      showMsg('error', '网络连接失败：' + (err.message || err));
    } finally {
      if (!pairedOk) {
        btn.disabled = false;
        btn.textContent = '验证并登入';
        pinInput.focus();
        pinInput.select();
      }
    }
  });
})();
</script>
</body>
</html>
